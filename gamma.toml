files = ["crates/**"]
exclude-files = [
    # Shared test fixtures are not production behavior.
    "crates/fetch_winhttp_impl/src/testing/**",
    "crates/fakeable_test/**",
    "crates/observed_testing/**",
    "crates/rest_over_grpc_examples/**",
    "crates/rest_over_grpc_tests/**",
    "crates/testing_aids/**",
    # Keep the existing package exclusions.
    "crates/http_headers/**",
    "crates/http_headers_simd/**",
    "crates/rallocator/**",
    "crates/seismograph_rallocator/**",
    # Terminal rendering, layout, mouse routing, and presentation-only formatting.
    "crates/seismograph_cli/src/commands/monitor/help.rs",
    "crates/seismograph_cli/src/commands/monitor/info_ui.rs",
    "crates/seismograph_cli/src/commands/monitor/mimalloc_ui.rs",
    "crates/seismograph_cli/src/commands/monitor/mouse.rs",
    "crates/seismograph_cli/src/commands/monitor/native_ui.rs",
    "crates/seismograph_cli/src/commands/monitor/native_ui/**",
    "crates/seismograph_cli/src/commands/monitor/panels.rs",
    "crates/seismograph_cli/src/commands/monitor/runtime_ui.rs",
    "crates/seismograph_cli/src/commands/monitor/task_events_ui.rs",
    "crates/seismograph_cli/src/commands/monitor/ui.rs",
    "crates/seismograph_cli/src/mimalloc_view.rs",
]
all-features = true
profile = "mutants"
cargo-args = ["--locked"]

# Diagnostic formatting has no stable behavioral contract.
# Gamma matches the final written trait name, not a resolved trait identity.
exclude-trait-impls = [
    "Debug", "Redactor", "RedactedDebug", "RedactedDisplay", "RedactedToString",
]

# Gamma selects unit and integration test targets itself.
# Keep the existing intentional-abort and real-time stress filters.
# Type-system contracts run in the native and careful suites.
cargo-test-args = [
    # Mutation instrumentation changes future layouts.
    "--skip", "hedging::service::tests::execute_future_size_is_bounded",
    "--skip", "abort::tests::subprocess_oracle_rejects_normal_return",
    "--skip", "abort::tests::subprocess_oracle_accepts_genuine_abort",
    "--skip", "backend::tests::missing_initialization_aborts_before_reading_range_metadata",
    "--skip", "combining::tests::consumed_action_aborts_instead_of_running_twice",
    "--skip", "observation::tests::poisoned_publication_copy_aborts_instead_of_reporting_empty_state",
    "--skip", "observation::tests::poisoned_publisher_aborts_instead_of_overwriting_failed_state",
    "--skip", "observation::tests::generation_overflow_aborts_instead_of_reusing_a_lease_identity",
    "--skip", "thread::tests::poisoned_pool_aborts_before_lending_an_owner",
    "--skip", "runner::tests::captured_logs_bound_sustained_output_and_timeout_cleanup",
    "--skip", "type_system_contracts",
    # metabench's spawned_benchmark tests compile and run benchmark examples.
    "--skip", "fresh_consumer_resolves_and_compiles_without_the_workspace_lockfile",
    "--skip", "perf_measures_exact_workload_and_writes_metrics",
    "--skip", "vtune_measures_exact_workload_and_writes_metrics",
    "--skip", "vtune_suppresses_report_output_without_show_engine_output",
    "--skip", "vtune_command_failure_surfaces_vtune_control_error",
    "--skip", "vtune_pause_failure_surfaces_vtune_control_error",
    "--skip", "help_reaches_metabench_parent",
    "--skip", "criterion_native_listing_is_forwarded",
    "--skip", "gungraun_listing_is_forwarded",
    "--skip", "gungraun_measurements_write_report",
    "--skip", "setup_calls_do_not_steal_filtered_allocation_measurements",
    "--skip", "criterion_worker_bypasses_allocation_tracking",
    "--skip", "shared_case_registration_keeps_gungraun_unavailable_on_unsupported_hosts",
    "--skip", "native_probe_cases_reuse_iterators_conditionals_and_lifecycle_hooks",
    "--skip", "native_vtune_orders_collection_and_teardown_on_success_and_unwind",
    "--skip", "native_allocations_include_prestarted_threads_only_inside_the_window",
    "--skip", "native_workers_ignore_foreign_collector_environment",
    "--skip", "native_perf_control_failures_are_bounded_and_preserve_reports",
    "--skip", "probe_listing_uses_native_cases_without_criterion_registration",
    "--skip", "smoke_and_empty_measurements_preserve_existing_reports",
    "--skip", "failed_native_setup_retains_worker_diagnostics",
    "--skip", "exact_filter_and_const_workload_support_allocation_probes",
    "--skip", "timed_out_worker_reports_captured_diagnostics_and_preserves_baseline",
    "--skip", "default_engine_smoke_checks_do_not_publish_measurements",
    "--skip", "criterion_and_allocations_write_parameterized_report",
]
