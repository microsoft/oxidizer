# GENERATED BY cargo-anvil. DO NOT EDIT DIRECTLY unless you intend to depart from anvil-provided defaults.
# Update cargo-anvil and regenerate; repository-specific edits stop automatic updates.
name: anvil-setup
description: Install `just` and the anvil tools/components needed by a specific group (or everything if omitted).
inputs:
  group:
    description: |
      Which anvil group to install setup for (e.g. "pr-fast",
      "pr-test", "scheduled-advisories"). Special values:
        - "" (default): install the full catalog via
          `just anvil-setup` -- use for local "give me everything"
          flows.
        - "none": skip tool installation entirely; just restore the
          Cargo cache and bootstrap just + binstall. Used by
          anvil-impact, which installs cargo-each and cargo-delta afterwards.
        - a name containing only lowercase letters, digits, and hyphens:
          install only that group's prerequisites via
          `just anvil-<group>-setup`.
    default: ""
    required: false
  free-disk-space:
    description: >-
      Remove unused pre-installed toolchains from GitHub-hosted Linux and
      Windows runners before setup. Reclaims approximately 18 GB on Linux and
      17 GB on Windows. No-op on macOS and self-hosted runners.
    default: "false"
    required: false
runs:
  using: composite
  steps:
    # Just reports the exact failing dependency recipe on stderr. GitHub
    # otherwise reduces that to "Process completed with exit code 1", so
    # promote Just's diagnostic to a workflow annotation.
    - name: Register Just problem matcher
      shell: bash
      run: echo "::add-matcher::$GITHUB_ACTION_PATH/just-problem-matcher.json"

    # Standard GitHub-hosted runners guarantee only 14 GB of SSD space. Heavy
    # build and test jobs can exceed that with target artifacts alone, so this
    # opt-in cleanup removes toolchains unused by anvil's Rust checks.
    - name: Free disk space (Linux)
      if: inputs.free-disk-space == 'true' && runner.environment == 'github-hosted' && runner.os == 'Linux'
      shell: bash
      run: |
        echo "Disk before cleanup:"
        df -h /
        # Android ~10 GB, Haskell ~4 GB, Swift ~3 GB, browser drivers ~1 GB.
        sudo rm -rf -- /usr/local/lib/android
        sudo rm -rf -- /opt/ghc /usr/local/.ghcup
        sudo rm -rf -- /usr/share/swift
        sudo rm -rf -- /usr/local/share/chromium /usr/local/share/edge_driver
        echo "Disk after cleanup:"
        df -h /

    - name: Free disk space (Windows)
      if: inputs.free-disk-space == 'true' && runner.environment == 'github-hosted' && runner.os == 'Windows'
      shell: pwsh -NoProfile -Command ". '{0}'"
      run: |
        function Get-FreeDiskGiB {
          [math]::Round((Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'").FreeSpace / 1GB, 1)
        }

        "Free before cleanup (GiB): $(Get-FreeDiskGiB)"
        $paths = @(
          'C:\Program Files (x86)\Android'
          'C:\Android'
          'C:\ghcup'
        )
        foreach ($path in $paths) {
          if (Test-Path -LiteralPath $path) {
            Remove-Item -LiteralPath $path -Recurse -Force
          }
        }
        "Free after cleanup (GiB): $(Get-FreeDiskGiB)"

    # Restore before bootstrapping Just so a warm job can reuse the cached
    # executable. Repository toolchain files intentionally define a fresh
    # cache generation, bounding registry growth without invalidating on
    # routine Cargo.toml or Cargo.lock edits.
    - name: Restore cargo cache
      id: cargo-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # The job suffix avoids concurrent saves; the prefix shares completed
        # caches across sibling jobs without crossing catalog/toolchain changes.
        key: anvil-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.cargo/config.toml', 'rust-toolchain', 'rust-toolchain.toml', '.anvil/setup.just') }}-${{ github.job }}
        restore-keys: |
          anvil-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.cargo/config.toml', 'rust-toolchain', 'rust-toolchain.toml', '.anvil/setup.just') }}-
        # Cargo's install ledgers make cached binaries visible to
        # `cargo install --list`. Build output is deliberately excluded.
        path: |
          ~/.cargo/registry/cache/
          ~/.cargo/registry/index/
          ~/.cargo/bin/
          ~/.cargo/.crates.toml
          ~/.cargo/.crates2.json

    # cargo-binstall keeps the cold bootstrap path fast.
    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.2

    # Setup inventory and source-install fallbacks invoke Cargo before
    # group-specific toolchain recipes run. Install the checkout-selected
    # toolchain first so rustup shims can service those calls on cold runners.
    - name: Install checkout Rust toolchain
      shell: bash
      run: rustup toolchain install --profile minimal

    # cargo-spellcheck links libclang when cargo-binstall falls back to a source
    # build. Install it eagerly on Linux jobs whose selected setup group includes
    # spellcheck, keeping package-manager policy in the GitHub runner adapter
    # rather than in the portable Just catalog.
    - name: Install libclang (Linux spellcheck groups)
      if: runner.environment == 'github-hosted' && runner.os == 'Linux' && (inputs.group == '' || inputs.group == 'spellcheck' || inputs.group == 'pr-fast' || inputs.group == 'pr' || inputs.group == 'full')
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libclang-dev

    - name: Install just
      shell: pwsh -NoProfile -Command ". '{0}'"
      env:
        # cargo-binstall uses GitHub Releases; authenticate its API requests.
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        $minimum = [version]'1.47.0'
        $installed = if (Get-Command just -ErrorAction SilentlyContinue) {
          [version]((& just --version) -replace '^just\s+', '')
        } else {
          $null
        }
        if ($null -eq $installed -or $installed -lt $minimum) {
          Write-Host "Installing just >= $minimum (installed: $(if ($installed) { $installed } else { 'not found' }))"
          & cargo binstall --no-confirm --locked --version ">=$minimum" just
          if ($LASTEXITCODE -ne 0) {
            & cargo install --locked --version ">=$minimum" just
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        }
        $installed = [version]((& just --version) -replace '^just\s+', '')
        if ($installed -lt $minimum) {
          Write-Error "cargo-anvil requires just >= $minimum for recipe options; found '$installed'. Install with: cargo install --locked --version '>=$minimum' just"
          exit 1
        }

    # Install the full catalog, no tools, or one group's prerequisites.
    - name: Install anvil toolchains + tools
      shell: bash
      # Keep action input out of shell source; validate before recipe-name use.
      env:
        ANVIL_GROUP: ${{ inputs.group }}
        GITHUB_TOKEN: ${{ github.token }}
      # Empty means the full catalog; `none` skips tools; any other value names
      # a group. GitHub opts into binaries while ADO uses source installation.
      run: |
        if [[ -n "$ANVIL_GROUP" && "$ANVIL_GROUP" != "none" && ! "$ANVIL_GROUP" =~ ^[a-z0-9-]+$ ]]; then
          echo "::error::Invalid Anvil group; expected lowercase letters, digits, and hyphens."
          # Distinguish invalid action input from a setup-recipe failure.
          exit 2
        fi

        case "$ANVIL_GROUP" in
          none) echo "anvil-setup: group=none, skipping tool install" ;;
          "")   just anvil-setup binstall ;;
          *)    just "anvil-$ANVIL_GROUP-setup" binstall ;;
        esac

    # Save partial installs even when setup fails so later runs do not repeat
    # the entire cold bootstrap.
    - name: Save cargo cache
      if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
        # Build output remains excluded.
        path: |
          ~/.cargo/registry/cache/
          ~/.cargo/registry/index/
          ~/.cargo/bin/
          ~/.cargo/.crates.toml
          ~/.cargo/.crates2.json
