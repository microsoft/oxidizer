examine_globs = ["crates/**"]
exclude_globs = [
    # Shared exclusions copied from mutants.toml.
    # Fixture scaffolding for the `fetch_winhttp` tests, benchmarks and examples.
    "crates/fetch_winhttp_impl/src/testing/**",
    "crates/fakeable_test/**",
    "crates/http_headers/**",
    "crates/http_headers_simd/**",
    "crates/observed_testing/**",
    # Allocator and its Seismograph integration are outside mutation-testing scope.
    "crates/rallocator/**",
    "crates/seismograph_rallocator/**",
    "crates/rest_over_grpc_examples/**",
    "crates/rest_over_grpc_tests/**",
    # Seismograph terminal rendering, layout, mouse routing, and presentation-only formatting.
    "crates/seismograph_cli/src/commands/monitor/help.rs",
    "crates/seismograph_cli/src/commands/monitor/info_ui.rs",
    "crates/seismograph_cli/src/commands/monitor/mouse.rs",
    "crates/seismograph_cli/src/commands/monitor/native_ui.rs",
    "crates/seismograph_cli/src/commands/monitor/native_ui/**",
    "crates/seismograph_cli/src/commands/monitor/panels.rs",
    "crates/seismograph_cli/src/commands/monitor/runtime_ui.rs",
    "crates/seismograph_cli/src/commands/monitor/task_events_ui.rs",
    "crates/seismograph_cli/src/commands/monitor/ui.rs",
    "crates/seismograph_cli/src/native_view.rs",
    "crates/testing_aids/**",

    # Windows host only.
    # Linux-only source is compiled out on Windows.
    "**/*linux.rs",
    "linux",
    # Unix monitor sources are compiled out on Windows, not surviving mutations.
    "crates/seismograph_protocol/src/platform/unix.rs",
    "crates/seismograph_protocol/src/platform/unix/**",
]
all_features = true
cap_lints = true
profile = "mutants"

# Only run unit tests and integration tests, not doctests, benchmarks or examples.
# Retain fatal-path tests needed to detect mutations in termination guards;
# skip the remaining intentional-abort tests only during mutation runs.
# Exact metabench deadlines use FakeClock/FakeProcess; keep real-time stress outside mutation runs.
# Type/trait UI contracts stay in native/careful suites. Runtime-body mutations
# do not change trait bounds, so rebuilding UI diagnostics adds no runtime coverage.
additional_cargo_test_args = [
    "--locked", "--tests", "--",
    "--skip", "abort::tests::subprocess_oracle_rejects_normal_return",
    "--skip", "abort::tests::subprocess_oracle_accepts_genuine_abort",
    "--skip", "backend::tests::missing_initialization_aborts_before_reading_range_metadata",
    "--skip", "combining::tests::consumed_action_aborts_instead_of_running_twice",
    "--skip", "observation::tests::poisoned_publication_copy_aborts_instead_of_reporting_empty_state",
    "--skip", "observation::tests::poisoned_publisher_aborts_instead_of_overwriting_failed_state",
    "--skip", "observation::tests::generation_overflow_aborts_instead_of_reusing_a_lease_identity",
    "--skip", "thread::tests::poisoned_pool_aborts_before_lending_an_owner",
    "--skip", "runner::tests::captured_logs_bound_sustained_output_and_timeout_cleanup",
    "--skip", "type_system_contracts",
]

exclude_re = [
    # This constructor delegates to Default; replacing it with Default is identical.
    'crates/observed_perf_counters/src/processor.rs:\d+:\d+: replace PerfCounterProcessor::builder -> PerfCounterProcessorBuilder with Default::default\(\)$',
    # These Unix open flags occupy disjoint bits; XOR is equivalent to OR at these call sites.
    'crates/seismograph_protocol/src/platform/unix.rs:\d+:\d+: replace \| with \^ in (directory_file|open_relative|create_descriptor|read_descriptor)$',
    # Returning fd 0 requires closing process stdin; tests do not invalidate inherited process descriptors.
    'crates/seismograph_protocol/src/platform/unix.rs:\d+:\d+: replace < with <= in open_relative$',
    # These native Windows access flags occupy disjoint bits, so OR and XOR are identical.
    'crates/seismograph_protocol/src/platform/windows/security.rs:\d+:\d+: replace \| with \^ in (directory_file|make_directory)$',
    # Unix and unsupported-platform pipe adapters are compiled out on Windows.
    'crates/metabench/src/worker_log\.rs:\d+:\d+: (?:.* in (?:prepare_reader_unix|prepare_reader_with|read_available_unix|prepare_reader_unsupported|read_available_unsupported)$|replace (?:prepare_reader_unix|prepare_reader_with|read_available_unix|prepare_reader_unsupported|read_available_unsupported) ->)',
    # Unix artifact-open flags are compiled out on Windows.
    'crates/metabench/src/artifact.rs:\d+:\d+: replace \| with (\^|&) in open_regular_file$',
    # Shared exclusions copied from mutants.toml.
    # There are no API contracts for what these must return because they
    # are for human-readable stringification. No purpose mutating them.
    "impl Debug",
    "impl fmt::Debug",
    "impl std::fmt::Debug",
    "impl core::fmt::Debug",
    "impl data_privacy::Redactor",
    "impl data_privacy::RedactedDebug",
    "impl data_privacy::RedactedDisplay",
    "impl data_privacy::RedactedToString",

    # Equivalent suffix caps: a power-of-two-aligned refill ends on a multiple
    # of the cursor's low bit, so alignment already bounds every suffix block.
    # These replacements only raise the redundant cap (division precedence
    # matters: BITS - 1 / zeros, not (BITS - 1) / zeros).
    'crates/rallocator/src/backend.rs:95:(76|80): replace - with (\+|/) in global_alloc_reserved$',
    'crates/rallocator/src/backend.rs:95:87: replace - with \+ in global_alloc_reserved$',
    'crates/rallocator/src/backend.rs:187:(80|84): replace - with (\+|/) in Local::alloc$',
    'crates/rallocator/src/backend.rs:187:91: replace - with \+ in Local::alloc$',
    # At i=4 both size formulas give 80; (i+4)%4 == (i-4)%4.
    # At the slab/waking thresholds both arms return CHUNK/32 respectively.
    'crates/rallocator/src/classes.rs:31:25: replace < with <= in make_classes$',
    'crates/rallocator/src/classes.rs:35:31: replace - with \+ in make_classes$',
    'crates/rallocator/src/classes.rs:38:32: replace < with <= in make_classes$',
    'crates/rallocator/src/classes.rs:45:37: replace < with <= in make_classes$',
    # end/cursor division is NOT equivalent: it creates sub-CHUNK suffix
    # blocks. Both exact mutants hang on Linux ARM64 and local Ubuntu x64.
    'crates/rallocator/src/backend.rs:95:87: replace - with / in global_alloc_reserved$',
    'crates/rallocator/src/backend.rs:187:91: replace - with / in Local::alloc$',

    # Cache hash distribution changes affect collision frequency, not correctness.
    # Keep mask/bounds mutations: those can select an invalid cache index.
    'crates/rallocator/src/core.rs:\d+:\d+: replace ReallocMap::set -> usize with (0|1)$',
    'crates/rallocator/src/core.rs:\d+:\d+: replace (>>|\*|\^) with (<<|\+|/|\||&) in ReallocMap::set$',
    'crates/rallocator/src/remote.rs:\d+:\d+: replace Cache::ring_set -> usize with (0|1)$',
    'crates/rallocator/src/remote.rs:\d+:\d+: replace (>>|/) with (<<|%|\*) in Cache::ring_set$',
    # Owner endpoints are 256-byte aligned; valid tags occupy only their zero low bits.
    'crates/rallocator/src/core.rs:\d+:\d+: replace \| with \^ in Core::new_slab$',
    # Small-slab needed is overwritten by refill before any observation or return.
    'crates/rallocator/src/core.rs:\d+:\d+: replace - with / in Core::new_slab$',
    # Native tests cannot reliably distinguish a removed release fence on relaxed
    # pointer handoff. Keep the fence and its concurrent handoff regressions.
    'crates/rallocator/src/core.rs:\d+:\d+: delete ! in Core::allocate_slow$',
    # CPU hints and batching/teardown budgets are performance policy, not API behavior.
    'crates/rallocator/src/hal/(aarch64|x86_64)/mod.rs:\d+:\d+: replace (prefetch|pause) with \(\)$',
    'crates/rallocator/src/remote.rs:1[56]:\d+: replace \* with (\+|/)$',
    'crates/rallocator/src/remote.rs:\d+:\d+: replace > with >= in Cache::reserve$',
    'crates/rallocator/src/thread.rs:\d+:\d+: replace < with <= in flush_for_teardown$',
    # Extra reservation padding is immediately unmapped by retain_mapping.
    # This mutation changes transient address-space demand, not retained size.
    'crates/rallocator/src/hal/linux/mod.rs:27:56: replace - with \+ in reserve_with_page_size$',
    # These Linux flags have disjoint bits, so OR and XOR are identical.
    'crates/rallocator/src/hal/linux/mod.rs:38:(31|53): replace \| with \^ in reserve_with_page_size$',
    'crates/rallocator/src/hal/linux/mod.rs:\d+:\d+: replace \| with \^ in (wait|wake_one)$',
    # MAP_ANONYMOUS ignores the file descriptor; -1 and 1 behave identically.
    'crates/rallocator/src/hal/linux/mod.rs:39:13: delete - in reserve_with_page_size$',
    # Legacy domain markup, CSS names and SVG stroke widths are presentation only.
    # View-local IDs have no fixed numbering: index and index+1 are injective
    # relabelings that preserve pairing, orphan identity and histogram membership.
    'crates/seismograph_rallocator/src/events.rs:78:38: replace \+ with \* in callers$',
    'crates/seismograph_cli/src/report.rs:\d+:\d+: replace render_domains with \(\)$',
    'crates/seismograph_cli/src/report.rs:\d+:\d+: replace slice_kind_class -> &.static str with (""|"xyzzy")$',
    'crates/seismograph_cli/src/report.rs:1878:\d+: replace (\+|/|\*) with (-|\*|%|\+|/) in render_thread_flow_diagram$',

    # Native ARM reproduction: subtracting the small-class index turns a 64KiB
    # fixture into 8TiB allocations; the test process exceeded 55GiB RSS.
    'crates/rallocator/src/classes.rs:103:34: replace \+ with - in Request::with_size$',
    # Removing the incoming drain spins flush indefinitely with queued returns.
    # Both exact mutations exhausted the native ARM test timeout.
    'crates/rallocator/src/core.rs:\d+:\d+: replace Core::drain with \(\)$',

    # Known hanging mutations from PR #764. Keep other mutations in these functions.
    # Reconfirmed native Linux deadlocks: invert combiner admission, prevent probe
    # progress, drain a retained tail, or route every cache message to one bucket.
    # These exact mutants exceed the bounded test timeout rather than escape assertions.
    'crates/rallocator/src/combining.rs:\d+:\d+: delete ! in Combining<T>::with$',
    'crates/rallocator/src/core.rs:\d+:\d+: replace \+ with \* in ReallocMap::(insert|remove)$',
    'crates/rallocator/src/remote.rs:\d+:\d+: replace Queue::can_dequeue -> bool with true$',
    'crates/rallocator/src/remote.rs:\d+:\d+: replace != with == in Queue::can_dequeue$',
    'crates/rallocator/src/remote.rs:\d+:\d+: replace Cache::slot -> usize with (0|1)$',
    # Removing the Windows wake call strands native waiters (reconfirmed on Windows).
    'crates/rallocator/src/hal/win64/mod.rs:\d+:\d+: replace wake_one with \(\)$',
    # Inverting the Linux wait predicate spins on immediate EAGAIN responses,
    # so the per-syscall timeout cannot bound it. Reproduced in an isolated test.
    'crates/rallocator/src/hal/linux/mod.rs:\d+:\d+: replace == with != in wait$',
    # Synchronization progress faults reproduced as whole-process hangs on
    # Linux x64/ARM64 in PR #854. Retain other mutations in these functions,
    # native behavioral tests, coverage, and Miri; do not spend minutes per hang.
    'crates/arty/src/runtime/worker/signal.rs:\d+:\d+: delete ! in WorkerSignal::wait_for_notification$',
    'crates/arty/src/runtime/worker/signal.rs:\d+:\d+: replace WorkerSignal::notify with \(\)$',
    'crates/performables/src/sync/channel.rs:\d+:\d+: replace & with (\||\^) in WatchReceiver<T>::wait_for_async$',
    'crates/performables/src/sync/channel.rs:\d+:\d+: delete ! in WatchReceiver<T>::wait_for_async$',
    'crates/performables/src/sync/notify.rs:\d+:\d+: replace Waiter::wake with \(\)$',
    'crates/performables/src/sync/notify.rs:\d+:\d+: replace State::try_take -> bool with false$',
    'crates/performables/src/sync/notify.rs:\d+:\d+: replace State::(notify_one|notify_from) with \(\)$',
    'crates/performables/src/sync/notify.rs:\d+:\d+: replace == with != in State::notify_from$',
    'crates/performables/src/sync/notify.rs:\d+:\d+: replace State::notify_waiter -> bool with (true|false)$',
    'crates/performables/src/sync/notify.rs:\d+:\d+: replace Notify<M>::notify_one with \(\)$',
    'crates/performables/src/sync/raw_mutex.rs:\d+:\d+: replace <impl Drop for RawMutexGuard.*>::drop with \(\)$',
    'crates/performables/src/sync/slot_list.rs:\d+:\d+: replace SlotList<T>::(remove|pop_front) -> Option<T> with None$',
    'crates/performables/src/sync/slot_list.rs:\d+:\d+: replace != with == in SlotList<T>::remove$',
    'crates/performables/src/sync/wait_queue.rs:\d+:\d+: replace Timeout::elapsed -> Duration with Default::default\(\)$',
    'crates/performables/src/sync/wait_queue.rs:\d+:\d+: replace Timeout::(remaining_after|remaining) -> Option<Duration> with Some\(Default::default\(\)\)$',
    'crates/performables/src/sync/wait_queue.rs:\d+:\d+: delete ! in Timeout::remaining_after$',
    'crates/performables/src/sync/wait_queue.rs:\d+:\d+: replace Waiter::register with \(\)$',
    'crates/performables/src/sync/wait_queue.rs:\d+:\d+: replace Waiter::take_waker -> Option<Waker> with None$',
    'crates/performables/src/sync/wait_queue.rs:\d+:\d+: delete ! in EagerWaitQueue::enqueue_if_needed_marked$',
    # Reproduced with MUTATION_TESTING=1 and progress watchdogs disabled.
    # Only the single-participant shortcut inversion hangs; keep arrival-count comparisons.
    'crates/performables/src/sync/barrier.rs:164:29: replace == with != in Barrier<Async>::arrive$',
    'crates/performables/src/sync/broadcast.rs:\d+:\d+: replace Broadcast::register -> bool with (true|false)$',
    'crates/performables/src/sync/broadcast.rs:\d+:\d+: delete ! in Broadcast::wake_all$',
    'crates/performables/src/sync/broadcast.rs:\d+:\d+: replace Broadcast::wake_all with \(\)$',
    'crates/performables/src/sync/channel.rs:\d+:\d+: replace WatchShared<T>::status -> u64 with 0$',
    'crates/performables/src/sync/channel.rs:\d+:\d+: replace WatchShared<T>::publish with \(\)$',
    'crates/performables/src/sync/channel.rs:\d+:\d+: replace WatchSender<T>::send -> Result<\(\), Error<T>> with Ok\(\(\)\)$',
    'crates/performables/src/sync/channel.rs:\d+:\d+: replace <impl Drop for WatchSender<T>>::drop with \(\)$',
    'crates/performables/src/sync/channel.rs:\d+:\d+: replace == with != in <impl Drop for WatchSender<T>>::drop$',
    'crates/performables/src/sync/channel.rs:\d+:\d+: replace WatchReceiver<T>::try_changed -> Option<Result<\(\), Error>> with None$',
    'crates/performables/src/sync/channel.rs:\d+:\d+: replace & with (\||\^) in WatchReceiver<T>::change_status$',
    'crates/performables/src/sync/channel.rs:\d+:\d+: delete ! in WatchReceiver<T>::change_status$',
    'crates/performables/src/sync/channel.rs:\d+:\d+: replace == with != in WatchReceiver<T>::change_status$',
    'crates/performables/src/sync/channel.rs:\d+:\d+: delete ! in WatchReceiver<T>::observe_change$',
    'crates/performables/src/sync/notify.rs:\d+:\d+: replace State::try_take -> bool with true$',
    'crates/performables/src/sync/notify.rs:\d+:\d+: replace Notify<M>::try_wait -> bool with true$',
    'crates/performables/src/sync/notify.rs:\d+:\d+: replace Notify<M>::wait with \(\)$',
    'crates/performables/src/sync/notify.rs:\d+:\d+: delete ! in Notify<M>::wait$',
    'crates/performables/src/sync/notify.rs:\d+:\d+: replace Notify<M>::wait_contended(_with)? -> bool with (true|false)$',
    'crates/performables/src/sync/wait_queue.rs:\d+:\d+: replace <impl Wake for ThreadWaker>::wake with \(\)$',
    'crates/performables/src/sync/wait_queue.rs:\d+:\d+: replace EagerWaitQueue::wake_(one|all)(_marked)? with \(\)$',
    'crates/performables/src/sync/wait_queue.rs:\d+:\d+: replace EagerWaitQueue::enqueue_if_needed_marked -> bool with (true|false)$',
    'crates/performables/src/sync/lock/native.rs:\d+:\d+: replace RwLockReadGuard.*::release_native with \(\)$',
    'crates/performables/src/sync/mutex/hal/mod.rs:\d+:\d+: replace <impl Drop for Unlock.*>::drop with \(\)$',
    'crates/performables/src/sync/mutex/hal/mod.rs:\d+:\d+: replace wake_all_at_address with \(\)$',
    'crates/performables/src/sync/mutex/hal/portable.rs:\d+:\d+: replace Condvar::notify_(one|all) with \(\)$',
    'crates/performables/src/sync/mutex/hal/portable.rs:\d+:\d+: replace Mutex::is_poisoned -> bool with false$',
    'crates/performables/src/sync/mutex/native.rs:\d+:\d+: replace Mutex<T, Sync>::release_panicking_native with \(\)$',
    'crates/performables/src/sync/mutex/native.rs:\d+:\d+: replace MutexGuard.*::release_native with \(\)$',
    'crates/performables/src/sync/lock/hal/portable.rs:\d+:\d+: replace RwLock::read_unlock with \(\)$',
    'crates/performables/src/sync/mutex/hal/address.rs:\d+:\d+: replace Mutex::unlock with \(\)$',
    'crates/performables/src/sync/mutex/hal/address.rs:\d+:\d+: replace == with != in Mutex::unlock$',
    # Reversing contended acquisition also stalls native ARM tests.
    'crates/performables/src/sync/mutex/hal/address.rs:\d+:\d+: replace != with == in Mutex::lock_contended$',
    'crates/performables/src/sync/mutex/hal/linux.rs:\d+:\d+: replace (wake|wake_lock|wake_condition_(one|all)) with \(\)$',
    # Windows wake-call deletion also strands native sleepers.
    'crates/performables/src/sync/mutex/hal/windows.rs:\d+:\d+: replace (wake_lock|wake_condition_(one|all)) with \(\)$',
    # FUTEX operation codes and PRIVATE_FLAG have disjoint bits; XOR is identical.
    'crates/performables/src/sync/mutex/hal/linux.rs:\d+:\d+: replace \| with \^$',
    # AND mismatches private wait/wake queues or turns wake into a blocking wait.
    'crates/performables/src/sync/mutex/hal/linux.rs:(11|12):\d+: replace \| with &$',
    'crates/performables/src/sync/condition.rs:\d+:\d+: replace Condvar<Sync>::notify_one with \(\)$',
    'crates/performables/src/sync/wait_queue.rs:\d+:\d+: replace WaitQueue::wake_all with \(\)$',
    # Exact ownership/progress mutations strand native RwLock tests, as confirmed
    # by bounded Windows mutation runs. Keep all other mutations in these methods.
    'crates/performables/src/sync/lock/native.rs:\d+:\d+: replace RwLockWriteGuard.*::release_native with \(\)$',
    'crates/performables/src/sync/lock/hal/address.rs:12:\d+: replace - with (\+|/)$',
    'crates/performables/src/sync/lock/hal/address.rs:14:\d+: replace - with \+$',
    'crates/performables/src/sync/lock/hal/address.rs:\d+:\d+: replace RwLock::try_read -> .* with None$',
    'crates/performables/src/sync/lock/hal/address.rs:\d+:\d+: replace < with (==|>) in RwLock::try_read$',
    'crates/performables/src/sync/lock/hal/address.rs:\d+:\d+: replace (== with !=|& with (\||\^)) in RwLock::write_contended_with$',
    'crates/performables/src/sync/lock/hal/address.rs:\d+:\d+: replace RwLock::(read_unlock|write_unlock|write_unlock_with) with \(\)$',
    'crates/performables/src/sync/lock/hal/address.rs:\d+:\d+: replace < with > in RwLock::read_contended_with$',
    # The preceding saturation assertion already rejects the equality case.
    'crates/performables/src/sync/lock/hal/address.rs:\d+:\d+: replace < with <= in RwLock::read_contended_with$',
    'crates/rallocator/src/tuning_telemetry.rs:50:48: replace - with (\+|/)$',
    'crates/rallocator/src/tuning_telemetry.rs:\d+:\d+: replace close_recording -> usize with 1$',
    'crates/rallocator/src/allocator/medium.rs:\d+:\d+: replace - with \+ in MediumCache::refill_count$',
    # Reversing the size-class shift timed out on both Linux and Windows.
    'crates/rallocator/src/allocator/medium.rs:\d+:\d+: replace << with >> in MediumCache::refill_count$',
    # Multiplying the remaining cache budget by block size timed out on Linux.
    'crates/rallocator/src/allocator/medium.rs:\d+:\d+: replace / with \* in MediumCache::refill_count$',
    'crates/seismograph_cli/src/commands/monitor/client.rs:\d+:\d+: replace (handshake|recording_configuration) -> Result<RecordingConfiguration, Error> with Ok\(Default::default\(\)\)$',
    'crates/seismograph_cli/src/commands/monitor/task_events/attribution.rs:215:19: replace < with (==|>) in reject_crossing_polls$',
    'crates/seismograph_cli/src/commands/monitor/task_events/attribution.rs:215:52: replace \|\| with && in reject_crossing_polls$',
    'crates/seismograph_cli/src/commands/monitor/task_events/attribution.rs:215:43: replace == with != in reject_crossing_polls$',
    'crates/seismograph_cli/src/commands/monitor/task_events/attribution.rs:\d+:\d+: replace \+= with \*= in (reject_crossing_polls|reject_concurrent_task_polls|assign)$',
    # The bits of a composite's child Sinks never overlap, so OR and XOR are identical.
    'crates/observed/src/sink/core.rs:\d+:\d+: replace \| with \^ in Sink::emit_impl$',

    # Windows host only.
    # Returning address 1 fails the reserved-refill assertions, but leaves other
    # parallel Windows allocator tests stuck until the suite timeout. The exact
    # mutant is caught by the isolated reserved-refill failure test.
    'crates/rallocator/src/backend.rs:\d+:\d+: replace global_alloc_reserved -> usize with 1$',
    # Linux perf is unavailable on Windows. `run_perf` exits before entering
    # its Linux implementation, and the worker definitions share one name.
    "\\brun_perf\\b",
    "\\blaunch_perf_worker\\b",
]
