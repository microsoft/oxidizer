# Managed by cargo-anvil. Update the corresponding template in the cargo-anvil
# crate unless the change is repository-specific.
# Update behaviour: https://github.com/microsoft/ox-tools/blob/main/crates/cargo-anvil/docs/design/updates.md
# The token pr-fast is substituted by cargo-anvil at emit time with
# the concrete check-group name (pr-fast, pr-test, scheduled-runtime-analysis, ...).
name: anvil-pr-fast
description: Run the pr-fast check group.
inputs:
  include_modified:
    description: |
      Pre-formatted --package name@version args for the modified tier, or the
      sentinel "--skip" when nothing is modified. The action resolves these
      portable specs to local package IDs. Local invocations leave it unset;
      recipes default to --workspace.
    default: ""
    required: false
  include_affected:
    description: |
      Same shape as include_modified, but for the affected tier
      (modified ∪ rev-deps).
    default: ""
    required: false
  include_required:
    description: |
      Same shape as include_modified, but for the required tier
      (affected ∪ workspace-internal transitive deps).
    default: ""
    required: false
  free-disk-space:
    description: Remove unused toolchains from GitHub-hosted runners before setup.
    default: "false"
    required: false
runs:
  using: composite
  steps:
    - uses: ./.github/actions/anvil-setup
      with:
        group: pr-fast
        free-disk-space: ${{ inputs.free-disk-space }}
    - name: Run just anvil-pr-fast
      shell: bash
      env:
        ANVIL_PORTABLE_MODIFIED: ${{ inputs.include_modified }}
        ANVIL_PORTABLE_AFFECTED: ${{ inputs.include_affected }}
        ANVIL_PORTABLE_REQUIRED: ${{ inputs.include_required }}
        # Some checks (e.g. cargo-aprz, run only by groups that include it)
        # hit the GitHub API; pass the built-in token so they use the
        # authenticated quota (1000 vs 60 req/hr). Harmless for groups whose
        # checks never read it.
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        ANVIL_INCLUDE_MODIFIED="$(just _anvil-impact-resolve "$ANVIL_PORTABLE_MODIFIED")"
        ANVIL_INCLUDE_AFFECTED="$(just _anvil-impact-resolve "$ANVIL_PORTABLE_AFFECTED")"
        ANVIL_INCLUDE_REQUIRED="$(just _anvil-impact-resolve "$ANVIL_PORTABLE_REQUIRED")"
        export ANVIL_INCLUDE_MODIFIED ANVIL_INCLUDE_AFFECTED ANVIL_INCLUDE_REQUIRED
        just anvil-pr-fast
