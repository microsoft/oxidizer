          const failedRecipe = process.env.ANVIL_FAILED_RECIPE || `anvil-${group}`;
          const displayRecipe = failedRecipe.replace(/^anvil-/, "");
          const runner = `${process.env.RUNNER_OS}-${process.env.RUNNER_ARCH}`.toLowerCase();
          if (!context.payload.pull_request?.head?.sha) {
            throw new Error(
              "anvil-report-status requires a pull_request event with a head SHA",
