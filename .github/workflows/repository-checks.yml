name: Repository checks

on:
  pull_request: {}
  push:
    branches: [main]
  merge_group: {}

permissions:
  contents: read

jobs:
  script-tests:
    name: "Repository script tests (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/anvil-setup
        with:
          group: none
      - name: Install Pester
        shell: pwsh
        run: |
          $existing = Get-Module Pester -ListAvailable |
              Where-Object Version -EQ ([version]'5.7.1') |
              Select-Object -First 1
          if ($null -eq $existing) {
              Install-Module -Name Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck
          }
      - name: Run Pester suite
        shell: pwsh
        run: just test-scripts

  simd-no-std-arm:
    name: SIMD no_std contract (native AArch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/anvil-setup
        with:
          group: none
      - name: Install Rust
        run: just anvil-toolchain-stable-install
      - name: Test isolated AArch64 no_std configuration
        run: just test-http-headers-simd-no-std-arm

  simd-no-std-x86:
    name: "SIMD no_std contract (baseline ${{ matrix.target }})"
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, i686-unknown-linux-gnu, i586-unknown-linux-gnu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/anvil-setup
        with:
          group: none
      - name: Install 32-bit linker and C runtime
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --quiet gcc-multilib
      - name: Install Rust target
        run: just setup-http-headers-simd-no-std-x86 --target "${{ matrix.target }}"
      - name: Test isolated baseline no_std configuration
        run: just test-http-headers-simd-no-std-x86 --target "${{ matrix.target }}"

  internity-32-bit-handles:
    name: Internity 32-bit handle restoration
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/anvil-setup
        with:
          group: none
      - name: Install Rust and 32-bit target
        run: |
          just anvil-toolchain-stable-install
          rustup target add --toolchain 1.95 i686-pc-windows-msvc
      - name: Test cross-width handle restoration
        run: cargo +1.95 test --package internity --all-features --target i686-pc-windows-msvc --lib --test cross_width_handles --locked

  internity-no-std-serde:
    name: Internity no_std serde tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/anvil-setup
        with:
          group: none
      - name: Install Rust
        run: just anvil-toolchain-stable-install
      - name: Test no_std with serde
        run: cargo +1.95 test --package internity --no-default-features --features serde --test no_std_api --locked

  rallocator-macos:
    name: "Rallocator macOS (${{ matrix.runner }})"
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/anvil-setup
        with:
          group: none
      - name: Install Rust
        run: just anvil-toolchain-stable-install
      - name: Check native macOS allocator and telemetry
        run: |
          rustup component add --toolchain 1.95 clippy
          cargo +1.95 clippy --package rallocator --package seismograph --package seismograph_rallocator --all-targets --all-features --locked -- -D warnings
          cargo +1.95 test --package rallocator --package seismograph --package seismograph_rallocator --all-features --locked
          cargo +1.95 test --package rallocator --release --all-features --locked

  metabench-native-contracts:
    name: Metabench native contracts (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      METABENCH_REQUIRE_NATIVE_CONTRACTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/anvil-setup
        with:
          group: none
          free-disk-space: "true"
      - name: Install Rust
        run: just anvil-toolchain-stable-install
      - name: Install native prerequisites
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target/metabench-contract-scratch"
          export TMPDIR="$GITHUB_WORKSPACE/target/metabench-contract-scratch"
          sudo apt-get update --quiet
          sudo apt-get install --yes --quiet valgrind
          cargo +1.95 install --locked --version 0.19.4 gungraun-runner
          gungraun-runner --version
          valgrind --version
      - name: Run native listing and smoke contracts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target/metabench-contract-scratch"
          export TMPDIR="$GITHUB_WORKSPACE/target/metabench-contract-scratch"
          cargo +1.95 test --package metabench --test spawned_benchmark --locked gungraun_listing_is_forwarded -- --exact --nocapture
          cargo +1.95 test --package metabench --test spawned_benchmark --locked default_engine_smoke_checks_do_not_publish_measurements -- --exact --nocapture

  required-repository-checks:
    name: Required repository checks
    if: always()
    needs: [script-tests, simd-no-std-arm, simd-no-std-x86, internity-32-bit-handles, internity-no-std-serde, rallocator-macos, metabench-native-contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Verify repository checks
        env:
          SCRIPT_TESTS: ${{ needs.script-tests.result }}
          SIMD_NO_STD_ARM: ${{ needs.simd-no-std-arm.result }}
          SIMD_NO_STD_X86: ${{ needs.simd-no-std-x86.result }}
          INTERNITY_32_BIT_HANDLES: ${{ needs.internity-32-bit-handles.result }}
          INTERNITY_NO_STD_SERDE: ${{ needs.internity-no-std-serde.result }}
          RALLOCATOR_MACOS: ${{ needs.rallocator-macos.result }}
          METABENCH_NATIVE_CONTRACTS: ${{ needs.metabench-native-contracts.result }}
        run: |
          if [[ "$SCRIPT_TESTS" != "success" ]]; then
            echo "::error::script-tests concluded $SCRIPT_TESTS"
            exit 1
          fi
          if [[ "$SIMD_NO_STD_ARM" != "success" ]]; then
            echo "::error::simd-no-std-arm concluded $SIMD_NO_STD_ARM"
            exit 1
          fi
          if [[ "$SIMD_NO_STD_X86" != "success" ]]; then
            echo "::error::simd-no-std-x86 concluded $SIMD_NO_STD_X86"
            exit 1
          fi
          if [[ "$INTERNITY_32_BIT_HANDLES" != "success" ]]; then
            echo "::error::internity-32-bit-handles concluded $INTERNITY_32_BIT_HANDLES"
            exit 1
          fi
          if [[ "$INTERNITY_NO_STD_SERDE" != "success" ]]; then
            echo "::error::internity-no-std-serde concluded $INTERNITY_NO_STD_SERDE"
            exit 1
          fi
          if [[ "$RALLOCATOR_MACOS" != "success" ]]; then
            echo "::error::rallocator-macos concluded $RALLOCATOR_MACOS"
            exit 1
          fi
          if [[ "$METABENCH_NATIVE_CONTRACTS" != "success" ]]; then
            echo "::error::metabench-native-contracts concluded $METABENCH_NATIVE_CONTRACTS"
            exit 1
          fi
