# GENERATED BY cargo-anvil. DO NOT EDIT DIRECTLY unless you intend to depart from anvil-provided defaults.
# Update cargo-anvil and regenerate; repository-specific edits stop automatic updates.
name: anvil-pr-impl

on:
  workflow_call:
    inputs:
      linux_runner:
        description: Runner label for x86_64 Linux jobs.
        type: string
        default: ubuntu-latest
      windows_runner:
        description: Runner label for x86_64 Windows jobs.
        type: string
        default: windows-latest
      linux_arm_runner:
        description: Runner label for aarch64 Linux jobs.
        type: string
        default: ubuntu-24.04-arm
      windows_arm_runner:
        description: Runner label for aarch64 Windows jobs.
        type: string
        default: windows-11-arm
      base_ref:
        description: Event-specific target commit SHA used by base-dependent checks.
        type: string
        required: true
      publish_commit_statuses:
        description: >-
          Best-effort management of supplemental failure commit statuses for
          same-repository pull requests. Requires statuses: write.
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        description: |
          Codecov upload token. Optional for public repos that have OIDC
          configured at Codecov; required for private repos.
        required: false

# A called workflow cannot elevate beyond its caller. Reset ordinary jobs here,
# then restore publication scopes only on their publishing jobs below.
permissions:
  contents: read

# Note on matrices: every multi-OS job below hardcodes its OS axis as
# an inline YAML array. Per-leg runner *labels* are inputs (so adopters
# can swap in self-hosted runners), but the OS axis itself is part of
# the workflow's identity — adopters who need a different shape (add
# macOS, drop ARM, mix in exotic targets) fork this file. Input-driven
# matrices were rejected because they added a silent failure mode
# (mis-formatted inputs produced empty matrices) without meaningfully
# expanding what adopters could customize.

jobs:
  # cargo-delta impact runs per OS so that downstream legs consume an
  # impact set computed against THEIR host's cargo-metadata depgraph.
  # Without this, an OS-conditional dep change (under
  # `[target.'cfg(target_os = ...)'.dependencies]`) computed on Linux
  # wouldn't include the cross-OS reverse-deps that only show up in
  # the Windows depgraph, so the Windows leg could skip tests that
  # ought to run. We split per-OS-family (not per-arch) -- arch-only
  # cfg gates are rare enough that paying for 4 impact jobs isn't
  # justified; arm legs reuse their OS counterpart's impact set.
  impact-linux:
    name: "Preparation: Impact Analysis (linux)"
    runs-on: ${{ inputs.linux_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No lfs: true -- the impact job only runs cargo-delta snapshot/impact
          # + cargo metadata over paths and dependency metadata; it never reads
          # LFS payload contents (the baseline worktree even disables LFS
          # smudging). Hydrating LFS assets here would add two large downloads
          # to the critical path for no impact-selection benefit. Downstream
          # group jobs keep lfs: true because they run arbitrary checks.
          fetch-depth: 0
      # anvil-impact runs `just anvil-impact` and uploads the resulting
      # target/anvil/impact cache as the anvil-impact-<runner.os> artifact.
      - uses: ./.anvil/github/actions/impact
        env:
          BASE_REF: ${{ inputs.base_ref }}

      - name: Report disk usage
        if: always()
        continue-on-error: true
        shell: pwsh -NoProfile -Command ". '{0}'"
        run: Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

  impact-windows:
    name: "Preparation: Impact Analysis (windows)"
    runs-on: ${{ inputs.windows_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # See impact-linux: impact needs only path/metadata inputs, not LFS
          # payloads, so it checks out without lfs: true.
          fetch-depth: 0
      - uses: ./.anvil/github/actions/impact
        env:
          BASE_REF: ${{ inputs.base_ref }}

      - name: Report disk usage
        if: always()
        continue-on-error: true
        shell: pwsh -NoProfile -Command ". '{0}'"
        run: Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

  # These job display names form repository-ruleset contexts. Treat cosmetic
  # changes as compatibility changes across PR and merge-group events.
  pr-fast:
    name: "Check Group: Fast Checks (${{ matrix.os }})"
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    # Compile-sensitive checks can differ for OS/architecture-gated code.
    needs: [impact-linux, impact-windows]
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, linux-arm, windows-arm]
    runs-on: ${{ matrix.os == 'linux' && inputs.linux_runner
      || matrix.os == 'windows' && inputs.windows_runner
      || matrix.os == 'linux-arm' && inputs.linux_arm_runner
      || inputs.windows_arm_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Download impact artifact
        # Pull the impact cache computed on this leg's OS family into
        # target/anvil/impact/ so the group's scoped checks read it via their
        # `anvil-impact` dependency -- the same code path as a local run. arm
        # legs reuse their OS family's artifact.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anvil-impact-${{ startsWith(matrix.os, 'linux') && 'Linux' || 'Windows' }}
          path: target/anvil/impact
      # Workflow reruns retain their original event payload. Resolve the title
      # from the API so a rerun after a title correction validates the current
      # value. A lookup failure fails closed; merge-group runs skip this step
      # and leave PR_TITLE empty so the recipe preserves its non-PR no-op.
      - name: Resolve current PR title
        id: pr_title
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            core.setOutput("title", pullRequest.title);
      - uses: ./.anvil/github/actions/run-group
        with:
          group: pr-fast
          publish_commit_statuses: ${{ inputs.publish_commit_statuses }}
          impact_mode: consume
        env:
          BASE_REF: ${{ inputs.base_ref }}
          PR_TITLE: ${{ steps.pr_title.outputs.title }}
      - name: Report disk usage
        if: always()
        continue-on-error: true
        shell: pwsh -NoProfile -Command ". '{0}'"
        run: Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

  pr-test:
    name: "Check Group: Tests and Coverage (${{ matrix.os }})"
    permissions:
      contents: read
      statuses: write
    # Tests + coverage: llvm-cov / doc-test / examples.
    # 4-leg matrix -- compile and runtime behaviour can differ across
    # OS and arch for cfg-gated code, so we exercise tests on every leg.
    # Coverage uploads from every leg except Windows ARM so Codecov sees
    # platform-gated code while avoiding that target's unusable LLVM profiles.
    needs: [impact-linux, impact-windows]
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, linux-arm, windows-arm]
    runs-on: ${{ matrix.os == 'linux' && inputs.linux_runner
      || matrix.os == 'windows' && inputs.windows_runner
      || matrix.os == 'linux-arm' && inputs.linux_arm_runner
      || inputs.windows_arm_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Download impact artifact
        # See pr-fast: pull the OS-family impact cache so scoped checks read it
        # via their `anvil-impact` dependency.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anvil-impact-${{ startsWith(matrix.os, 'linux') && 'Linux' || 'Windows' }}
          path: target/anvil/impact
      - uses: ./.anvil/github/actions/run-group
        with:
          group: pr-test
          publish_commit_statuses: ${{ inputs.publish_commit_statuses }}
          free-disk-space: true
          impact_mode: consume
      - name: Upload coverage to Codecov
        # Upload every supported native slice so Codecov can union cfg-gated
        # coverage. Windows ARM is excluded because its LLVM profiles are
        # unusable. Require the merged feature-configuration report.
        if: always() && matrix.os != 'windows-arm' && hashFiles('target/coverage/lcov-merged.info') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: target/coverage/lcov-merged.info
          flags: ${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Report disk usage
        if: always()
        continue-on-error: true
        shell: pwsh -NoProfile -Command ". '{0}'"
        run: Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

  pr-msrv:
    name: "Check Group: MSRV Tests (${{ matrix.os }})"
    permissions:
      contents: read
      statuses: write
    needs: [impact-linux, impact-windows]
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, linux-arm, windows-arm]
    runs-on: ${{ matrix.os == 'linux' && inputs.linux_runner
      || matrix.os == 'windows' && inputs.windows_runner
      || matrix.os == 'linux-arm' && inputs.linux_arm_runner
      || inputs.windows_arm_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Download impact artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anvil-impact-${{ startsWith(matrix.os, 'linux') && 'Linux' || 'Windows' }}
          path: target/anvil/impact
      - uses: ./.anvil/github/actions/run-group
        with:
          group: pr-msrv
          publish_commit_statuses: ${{ inputs.publish_commit_statuses }}
          free-disk-space: true
          impact_mode: consume

      - name: Report disk usage
        if: always()
        continue-on-error: true
        shell: pwsh -NoProfile -Command ". '{0}'"
        run: Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

  pr-runtime-analysis:
    name: "Check Group: Runtime Analysis (${{ matrix.os }}, ${{ matrix.check }})"
    permissions:
      contents: read
      statuses: write
    # Stricter-runtime correctness: miri + careful + loom.
    # Runtime checks compile per host target and can surface OS/arch-specific
    # bugs. Separate Miri, Careful, and Loom jobs keep full-workspace Miri
    # below the six-hour GitHub-hosted job limit.
    needs: [impact-linux, impact-windows]
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, linux-arm, windows-arm]
        check: [miri, careful, loom]
    runs-on: ${{ matrix.os == 'linux' && inputs.linux_runner
      || matrix.os == 'windows' && inputs.windows_runner
      || matrix.os == 'linux-arm' && inputs.linux_arm_runner
      || inputs.windows_arm_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Download impact artifact
        # See pr-fast: pull the OS-family impact cache so scoped checks read it
        # via their `anvil-impact` dependency.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anvil-impact-${{ startsWith(matrix.os, 'linux') && 'Linux' || 'Windows' }}
          path: target/anvil/impact
      - uses: ./.anvil/github/actions/run-group
        with:
          group: ${{ matrix.check }}
          publish_commit_statuses: ${{ inputs.publish_commit_statuses }}
          impact_mode: consume

      - name: Report disk usage
        if: always()
        continue-on-error: true
        shell: pwsh -NoProfile -Command ". '{0}'"
        run: Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

  pr-fuzzing:
    name: "Check Group: Fuzzing (${{ matrix.os }})"
    permissions:
      contents: read
      statuses: write
    needs: [impact-linux]
    strategy:
      fail-fast: false
      matrix:
        os: [linux, linux-arm]
    runs-on: ${{ matrix.os == 'linux' && inputs.linux_runner || inputs.linux_arm_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Download impact artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anvil-impact-Linux
          path: target/anvil/impact
      - uses: ./.anvil/github/actions/run-group
        with:
          group: pr-fuzzing
          publish_commit_statuses: ${{ inputs.publish_commit_statuses }}
          impact_mode: consume

      - name: Report disk usage
        if: always()
        continue-on-error: true
        shell: pwsh -NoProfile -Command ". '{0}'"
        run: Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

  pr-mutants:
    name: "Check Group: Mutation Testing (${{ matrix.os }})"
    permissions:
      contents: read
      statuses: write
      actions: read
      security-events: write
    # Mutation testing: cargo gamma (diff-scoped against the PR base).
    # Preserve all four repository-ruleset contexts, but run the multi-hour
    # campaign only on Windows x64. The other legs complete as explicit no-ops;
    # scheduled exhaustive checks retain Linux + Windows mutation coverage.
    needs: [impact-linux, impact-windows]
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, linux-arm, windows-arm]
    runs-on: ${{ matrix.os == 'linux' && inputs.linux_runner
      || matrix.os == 'windows' && inputs.windows_runner
      || matrix.os == 'linux-arm' && inputs.linux_arm_runner
      || inputs.windows_arm_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.os == 'windows'
        with:
          lfs: true
          fetch-depth: 0
      - name: Download impact artifact
        if: matrix.os == 'windows'
        # See pr-fast: pull the OS-family impact cache so scoped checks read it
        # via their `anvil-impact` dependency.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anvil-impact-Windows
          path: target/anvil/impact
      - uses: ./.anvil/github/actions/run-group
        if: matrix.os == 'windows'
        with:
          group: pr-mutants
          publish_commit_statuses: ${{ inputs.publish_commit_statuses }}
          impact_mode: consume
        env:
          BASE_REF: ${{ inputs.base_ref }}
      - name: Mutation testing runs on Windows x64
        if: matrix.os != 'windows'
        shell: bash
        run: echo "Mutation testing is covered by the Windows x64 matrix leg."

      - name: Report disk usage
        if: always()
        continue-on-error: true
        shell: pwsh -NoProfile -Command ". '{0}'"
        run: Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

  required-checks:
    # This display name is the repository-ruleset context. Keep it stable
    # across pull-request and merge-group callers.
    name: Required Anvil checks
    if: always()
    needs:
      - impact-linux
      - impact-windows
      - pr-fast
      - pr-test
      - pr-msrv
      - pr-runtime-analysis
      - pr-fuzzing
      - pr-mutants
    runs-on: ${{ inputs.linux_runner }}
    steps:
      - name: Verify every Anvil job family succeeded
        shell: bash
        env:
          IMPACT_LINUX: ${{ needs.impact-linux.result }}
          IMPACT_WINDOWS: ${{ needs.impact-windows.result }}
          PR_FAST: ${{ needs.pr-fast.result }}
          PR_TEST: ${{ needs.pr-test.result }}
          PR_MSRV: ${{ needs.pr-msrv.result }}
          PR_RUNTIME_ANALYSIS: ${{ needs.pr-runtime-analysis.result }}
          PR_FUZZING: ${{ needs.pr-fuzzing.result }}
          PR_MUTANTS: ${{ needs.pr-mutants.result }}
        run: |
          status=0
          for result in \
            "impact-linux=$IMPACT_LINUX" \
            "impact-windows=$IMPACT_WINDOWS" \
            "pr-fast=$PR_FAST" \
            "pr-test=$PR_TEST" \
            "pr-msrv=$PR_MSRV" \
            "pr-runtime-analysis=$PR_RUNTIME_ANALYSIS" \
            "pr-fuzzing=$PR_FUZZING" \
            "pr-mutants=$PR_MUTANTS"
          do
            name="${result%%=*}"
            conclusion="${result#*=}"
            if [[ "$conclusion" != "success" ]]; then
              echo "::error::$name concluded $conclusion"
              status=1
            fi
          done
          exit "$status"
      - name: Report disk usage
        if: always()
        continue-on-error: true
        shell: pwsh -NoProfile -Command ". '{0}'"
        run: Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize
