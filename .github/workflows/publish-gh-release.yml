# Creates a GitHub release for a crate when a version tag (e.g. "bytesbuf-v1.2.3")
# is pushed. Extracts the relevant changelog section and publishes the release via
# `scripts/publish-gh-release.rs`. This workflow is triggered automatically by tag
# pushes and is not intended to be run manually.

name: Publish GitHub Release

permissions:
  contents: write

on:
  push:
    tags:
    - '*-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to create a release for (e.g. "oxidizer-v1.2.3")'
        required: true

jobs:
  create-release:
    runs-on: ubuntu-slim
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup
      uses: ./.github/actions/anvil-setup
      with:
        group: none

    - name: Install release toolchain
      run: just anvil-toolchain-nightly-install

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: just publish-gh-release --repository "${{ github.repository }}" --tag "${{ inputs.tag || github.ref_name }}"
