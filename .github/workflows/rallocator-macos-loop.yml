# Keep this experiment branch PR-free so ordinary PR checks do not run.
# Add [mac-intel] to a commit message to include Intel in that push's build.
name: Rallocator macOS hot loop

on:
  push:
    branches: [ralfbiedert-rallocator-macos-support]

permissions:
  contents: read

concurrency:
  group: rallocator-macos-loop-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: "1.95"
  CARGO_INCREMENTAL: "1"
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: Native build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(contains(github.event.head_commit.message, '[mac-intel]') && '["macos-15", "macos-15-intel"]' || '["macos-15"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: rallocator-macos-v1-${{ matrix.runner }}-rust-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            rallocator-macos-v1-${{ matrix.runner }}-rust-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}-
            rallocator-macos-v1-${{ matrix.runner }}-rust-${{ env.RUSTUP_TOOLCHAIN }}-
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            ~/.rustup/toolchains/1.95-*/
            target/

      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update

      - name: Build and link rallocator tests
        run: |
          {
            sw_vers
            uname -m
            getconf PAGESIZE
            rustc --version
            cargo test --package rallocator --no-run --locked
          } 2>&1 | tee "$RUNNER_TEMP/rallocator-macos.log"

      - name: Upload compiler output
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rallocator-build-${{ matrix.runner }}
          path: ${{ runner.temp }}/rallocator-macos.log

      # Preserve useful compiler work even when the port does not build yet.
      - name: Save build cache
        if: always() && !cancelled() && steps.cache.outputs.cache-primary-key != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.cache.outputs.cache-primary-key }}
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            ~/.rustup/toolchains/1.95-*/
            target/
