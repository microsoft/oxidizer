[package]
name = "seismograph_protocol"
version = "0.2.0"
description = "Local monitor protocol and discovery model for Seismograph."
readme = "README.md"
keywords = ["telemetry", "diagnostics", "protocol", "monitoring"]
categories = ["development-tools::debugging"]

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
include.workspace = true
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/seismograph_protocol"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[package.metadata.docs.rs]
features = ["test-util"]

[features]
test-util = []

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dependencies]
getrandom.workspace = true
tempfile.workspace = true

[dev-dependencies]
mutants.workspace = true
tempfile.workspace = true

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
