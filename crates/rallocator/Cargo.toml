[package]
name = "rallocator"
version = "0.1.0"
description = "Windows and Linux x64 owner-return allocator with Seismograph allocation events."
readme = "README.md"
keywords = ["allocator", "memory", "performance", "telemetry"]
categories = ["memory-management"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
include.workspace = true
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/rallocator"
# v1 benchmark sources are retained unchanged, but are not v4 build targets.
autobenches = false

[dependencies]
seismograph.workspace = true
seismograph_rallocator.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[lints]
workspace = true
