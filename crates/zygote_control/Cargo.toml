[package]
name = "zygote_control"
description = "Provides a std-like controller for accelerated and native process launches."
version = "0.1.0"
readme = "README.md"
keywords = ["process", "spawn", "zygote"]
categories = ["os"]

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
include.workspace = true
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/zygote_control"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

# Process launch backends necessarily contain platform and kernel-error paths
# that cannot all be exercised on one coverage runner. Keep the floor at the
# lowest supported Linux architecture's measured baseline.
[package.metadata.coverage-gate]
min-lines-percent = 75

[package.metadata.cargo_check_external_types]
allowed_external_types = ["bitflags::*"]

[features]
default = []

[target.'cfg(target_os = "linux")'.dependencies]
bitflags = { workspace = true }
prost = { workspace = true, features = ["std"] }
zygote_rt = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
prost = { workspace = true, features = ["std"] }
zygote_rt = { workspace = true, features = ["private-test-util"] }

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
