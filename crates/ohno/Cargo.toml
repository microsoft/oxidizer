[package]
name = "ohno"
description = "High-quality Rust error handling."
version = "0.5.2"
readme = "README.md"
keywords = ["oxidizer", "error", "backtrace"]
categories = ["data-structures"]

edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
include = { workspace = true }
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/ohno"

# Ohno and its generated API contain no runtime unsafe code. Native tests and
# cargo-careful retain the full error-formatting and macro behavior coverage.
[package.metadata.anvil.miri]
exclude = true

[package.metadata.cargo_check_external_types]
allowed_external_types = ["ohno_macros::*"]

[package.metadata.docs.rs]
all-features = true

[features]
app-err = []
test-util = []

[dependencies]
# Other workspace crates use published ohno through the root workspace dependency,
# without a local path or crates.io patch, so unreleased changes stay isolated.
# Keep macro-family dependencies in their owning manifests, not the root manifest.
# Paths support local development; exact versions keep the published family aligned.
# Publish ohno, ohno_macros, and ohno_macros_impl together at the same version.
ohno_macros = { path = "../ohno_macros", default-features = false, version = "=0.5.2" }
typeid = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
insta = { workspace = true }
mutants = { workspace = true }
regex = { workspace = true, features = ["unicode-perl"] }
testing_aids = { path = "../testing_aids" }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "time",
    "rt-multi-thread",
] }
trybuild = { workspace = true }

[[example]]
name = "app_err_automatic_conversion"
path = "examples/app/automatic_conversion.rs"
required-features = ["app-err"]

[[example]]
name = "app_err_backtrace"
path = "examples/app/backtrace.rs"
required-features = ["app-err"]

[[example]]
name = "bail"
path = "examples/app/bail.rs"
required-features = ["app-err"]

[[example]]
name = "app_err_construction"
path = "examples/app/construction.rs"
required-features = ["app-err"]

[[example]]
name = "app_err_enrichment"
path = "examples/app/enrich_err.rs"
required-features = ["app-err"]

[[example]]
name = "app_err_into_std_error"
path = "examples/app/into_std_error.rs"
required-features = ["app-err"]

[[example]]
name = "into_app_err"
path = "examples/app/into_app_err.rs"
required-features = ["app-err"]

[[example]]
name = "app-err_root_cause"
path = "examples/app/root_cause.rs"
required-features = ["app-err"]

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
