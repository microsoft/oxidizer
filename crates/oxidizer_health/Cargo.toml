[package]
name = "oxidizer_health"
description = "Application health aggregation with component reports."
version = "0.1.0"
readme = "README.md"
keywords = ["health", "readiness", "diagnostics"]
categories = ["asynchronous"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
include.workspace = true
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/oxidizer_health"

[package.metadata.cargo_check_external_types]
# Thread-aware handles.
allowed_external_types = ["thread_aware_core::thread_aware::ThreadAware"]

[features]
default = []

[dependencies]
arc-swap.workspace = true
foldhash = { workspace = true, features = ["std"] }
performables.workspace = true
thread_aware = { workspace = true, features = ["std"] }
tracing.workspace = true

[dev-dependencies]
ctor.workspace = true
futures = { workspace = true, features = ["executor"] }
static_assertions.workspace = true
testing_aids = { path = "../testing_aids" }

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
