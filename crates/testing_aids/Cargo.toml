[package]
name = "testing_aids"
description = "Testing utilities."
version = "0.0.0"
readme = "README.md"
publish = false

edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
include = { workspace = true }

[package.metadata.cargo_check_external_types]
# Internal crate (publish = false; listed in automation::INTERNAL_CRATES). Not a
# public-API surface, so allow all external types — this opts the crate into the
# external-types check permissively rather than denying its internal use of
# opentelemetry/tracing/etc.
allowed_external_types = ["*"]

# Test-helper crate: the whole crate is `#![cfg_attr(coverage_nightly,
# coverage(off))]` (its utilities are exercised opportunistically by other
# crates' tests), so it produces no coverage data. Opt out of the gate.
[package.metadata.coverage-gate]
min-lines-percent = 0

[dependencies]
futures = { workspace = true, features = ["executor"], optional = true }
opentelemetry = { workspace = true, features = ["metrics"], optional = true }
opentelemetry_sdk = { workspace = true, features = ["metrics", "testing"], optional = true }
prettyplease = { workspace = true, optional = true }
proc-macro2 = { workspace = true, optional = true }
syn = { workspace = true, features = ["full", "parsing", "printing", "clone-impls"], optional = true }
tracing = { workspace = true, features = ["std"], optional = true }
tracing-subscriber = { workspace = true, features = ["fmt", "registry"], optional = true }

[features]
default = ["runtime"]

# Async, metric and `tracing` helpers. On by default, so the crates that take
# `testing_aids` by path keep working unchanged. Proc-macro crates take it as
# `{ workspace = true, features = ["macros"] }` instead -- the workspace
# dependency sets `default-features = false`, which keeps the `opentelemetry`
# and `tracing` stacks out of a dev graph that only needs `syn`.
runtime = ["dep:futures", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:tracing", "dep:tracing-subscriber"]

# Snapshot helpers for procedural-macro expansions.
macros = ["dep:prettyplease", "dep:proc-macro2", "dep:syn"]

[dev-dependencies]
ctor = { workspace = true }
serial_test = { workspace = true }

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
