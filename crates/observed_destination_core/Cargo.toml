[package]
name = "observed_destination_core"
description = "Contains shared components for defining various destinations for Observed pipeline."
version = "0.1.0"
readme = "README.md"
keywords = ["oxidizer", "observed", "telemetry", "tracing", "logging", "metrics"]
categories = ["development-tools::debugging"]

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
include.workspace = true
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/observed_destination_core"

[package.metadata.docs.rs]
all-features = true

[dependencies]
# 3rd-party
jiff = { workspace = true, default-features = false, features = ["std"] }
log = { workspace = true }
opentelemetry = { workspace = true, features = ["logs", "metrics"] }
opentelemetry_sdk = { workspace = true, features = ["logs", "metrics"] }

[dev-dependencies]
insta = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
performables = { workspace = true }

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
