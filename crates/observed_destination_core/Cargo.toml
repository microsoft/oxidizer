[package]
name = "observed_destination_core"
description = "Contains shared components for defining various destinations for Observed pipeline."
version = "0.29.0"
readme = "README.md"
keywords = ["observed", "telemetry", "tracing", "logging", "metrics"]
categories = ["development-tools::debugging"]

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
include.workspace = true
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/observed_destination_core"

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "log::LevelFilter",
    "opentelemetry_sdk::error::OTelSdkResult",
    "opentelemetry_sdk::logs::log_processor::LogProcessor",
    "opentelemetry_sdk::logs::logger_provider::LoggerProviderBuilder",
    "opentelemetry_sdk::logs::record::SdkLogRecord",
    "opentelemetry_sdk::metrics::meter_provider::MeterProviderBuilder",
    "opentelemetry_sdk::resource::Resource",
    "opentelemetry::common::InstrumentationScope",
    "opentelemetry::logs::record::Severity",
    "opentelemetry::metrics::meter::MeterProvider",
]

[package.metadata.docs.rs]
all-features = true

[dependencies]
# 3rd-party
jiff = { workspace = true, default-features = false, features = ["std"] }
log = { workspace = true }
observed_utils = { workspace = true }
opentelemetry = { workspace = true, features = ["logs", "metrics"] }
opentelemetry_sdk = { workspace = true, features = ["logs", "metrics"] }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
performables = { path = "../performables", default-features = false }
static_assertions.workspace = true

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
