[package]
name = "fetch_winhttp"
description = "WinHTTP-based HTTP transport for the fetch client (Windows only)."
version = "0.1.0"
readme = "README.md"
keywords = ["oxidizer", "http", "client", "winhttp", "windows"]
categories = ["network-programming", "web-programming::http-client"]

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
include.workspace = true
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/fetch_winhttp"

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-pc-windows-msvc"

[dependencies]

[dev-dependencies]

[target.'cfg(windows)'.dev-dependencies]
anyhow = { workspace = true, features = ["std"] }
bytes = { workspace = true }
http-body-util = { workspace = true, features = ["channel"] }
hyper = { workspace = true, features = ["http2", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
rcgen = { workspace = true, features = ["crypto", "ring"] }
rustls = { workspace = true, features = ["ring", "std"] }
tokio = { workspace = true, features = ["net", "rt", "time"] }
tokio-rustls = { workspace = true, features = ["ring"] }
windows-sys = { workspace = true, features = [
    "Win32_Networking_WinHttp",
] }

[lints]
workspace = true
