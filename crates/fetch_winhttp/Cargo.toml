[package]
name = "fetch_winhttp"
description = "WinHTTP transport for the fetch client on Windows."
version = "0.6.0"
readme = "README.md"
keywords = ["oxidizer", "http", "client", "winhttp", "windows"]
categories = ["network-programming", "web-programming::http-client"]

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
include.workspace = true
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/fetch_winhttp"

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "bytesbuf::mem::opaque_memory::OpaqueMemory",
    "fetch::client_builder::HttpClientBuilder",
    # The implementation crate contains the transport. This crate re-exports
    # its supported public API.
    "fetch_winhttp_impl::*",
    "observed::*",
    "thread_aware_core::thread_aware::ThreadAware",
    "tick::clock::Clock",
]

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-pc-windows-msvc"

# The benchmark bodies compile only on Windows. On other platforms,
# `cargo-udeps` reports these dependencies as unused. The benchmark harness uses
# `alloc_tracker` and `criterion` on every platform.
[package.metadata.cargo-udeps.ignore]
development = ["all_the_time", "benchmarking"]

[target.'cfg(windows)'.dependencies]
fetch_winhttp_impl = { workspace = true }

# `--all-targets` builds the benchmark harness on every platform. These
# dependencies must resolve even when the benchmark body does not compile.
[dev-dependencies]
all_the_time = { workspace = true }
alloc_tracker = { workspace = true }
benchmarking = { path = "../benchmarking" }
criterion = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
bytes = { workspace = true }
bytesbuf = { path = "../bytesbuf", default-features = false }
fetch = { path = "../fetch" }
# Tests, benchmarks, and examples use these localhost fixtures. The
# `private-test-util` feature avoids a package dependency cycle. See
# `docs/private-test-utils.md`.
fetch_winhttp_impl = { path = "../fetch_winhttp_impl", features = ["private-test-util"] }
futures = { workspace = true, features = ["executor", "std"] }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
http_extensions = { path = "../http_extensions" }
observed = { path = "../observed" }
ohno = { workspace = true, features = ["app-err"] }
# `test-util` freezes time in tests and benchmarks. `tokio` drives a real clock
# in the standalone examples.
tick = { path = "../tick", features = ["test-util", "tokio"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "non_windows"
path = "tests/non_windows.rs"

[[bench]]
name = "fw_request"
harness = false

[[bench]]
name = "fw_client"
harness = false

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
