[package]
name = "arty_macros"
description = "Runtime entry-point macros for Arty."
version = "0.3.1"
readme = "README.md"
keywords = ["arty", "async", "runtime", "proc-macro"]
categories = ["asynchronous"]
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
include = { workspace = true }
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/arty_macros"

[package.metadata.docs.rs]
all-features = true

# Thin proc-macro shims are exercised by consumer expansion; implementation
# logic and its coverage gate live in arty_macros_impl.
[package.metadata.coverage-gate]
min-lines-percent = 0

[lib]
proc-macro = true

[dependencies]
arty_macros_impl = { workspace = true }

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
tick = { path = "../tick", features = ["test-util"] }

[lints]
workspace = true
