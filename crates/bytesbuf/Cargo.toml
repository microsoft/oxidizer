[package]
name = "bytesbuf"
description = "Types for creating and manipulating byte sequences."
version = "0.9.0"
readme = "README.md"
keywords = ["oxidizer", "buffers", "io", "zero-copy"]
categories = ["data-structures", "network-programming"]

edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
include = { workspace = true }
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/bytesbuf"

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "bytes::bytes::Bytes",
    "bytes::buf::buf_impl::Buf",
    "bytes::buf::uninit_slice::UninitSlice",
    "bytes::buf::buf_mut::BufMut",
    "thread_aware_core::thread::Thread",
    "thread_aware_core::thread_aware::ThreadAware",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
# Enables the global memory pool, standard I/O adapters, and metrics. Disable for `#![no_std]`
# environments; the crate still requires `alloc`.
std = ["dep:nm", "dep:plurality", "thread_aware/std", "bytes?/std"]
# Interoperability with the `bytes` crate.
bytes-compat = ["dep:bytes"]
test-util = ["std"]

[dependencies]
bytes = { workspace = true, optional = true }
nm = { workspace = true, optional = true }
plurality = { workspace = true, optional = true }
smallvec = { workspace = true, features = ["const_new", "union"] }
thread_aware = { workspace = true, default-features = false, features = ["derive"] }

[dev-dependencies]
alloc_tracker = { workspace = true }
benchmarking = { path = "../benchmarking" }
bytes = { workspace = true, features = ["std"] }
criterion = { workspace = true }
mutants = { workspace = true }
new_zealand = { workspace = true }
nm = { workspace = true }
plurality = { path = "../plurality" }
static_assertions = { workspace = true }
testing_aids = { path = "../testing_aids" }

# Gungraun (Callgrind) requires Valgrind, which is Linux-only. Gating the dependency on Linux keeps
# it out of Windows and macOS resolution so `cargo-machete`/`cargo-udeps` do not flag it as unused.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun = { workspace = true, features = ["default"] }
libc = { workspace = true }

[target.'cfg(target_os = "windows")'.dev-dependencies]
# `windows-sys` enables no Win32 modules by default; each module used must be listed.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
] }

[[bench]]
name = "buf"
harness = false
required-features = ["test-util"]

[[bench]]
name = "bytesbuf_vs_bytes"
harness = false
required-features = ["test-util"]

[[bench]]
name = "global_pool"
harness = false
required-features = ["std"]

[[bench]]
name = "view"
harness = false
required-features = ["test-util"]

[[bench]]
name = "view_cg"
harness = false
required-features = ["test-util"]

[[bench]]
name = "buf_cg"
harness = false
required-features = ["test-util"]

[[bench]]
name = "global_pool_cg"
harness = false
required-features = ["std"]

[[example]]
name = "bb_has_memory_forwarding"
required-features = ["test-util"]

[[example]]
name = "bb_has_memory_optimizing"
required-features = ["test-util"]

[[example]]
name = "bb_static_data"
required-features = ["test-util"]

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
