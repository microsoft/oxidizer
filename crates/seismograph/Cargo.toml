[package]
name = "seismograph"
version = "0.3.0"
description = "High-performance process telemetry with extensible snapshot sources."
readme = "README.md"
keywords = ["telemetry", "diagnostics", "profiling", "performance"]
categories = ["development-tools::debugging"]

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
include.workspace = true
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/seismograph"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc.workspace = true

[package.metadata.docs.rs]
all-features = true

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "seismograph_protocol::Error",
    "seismograph_protocol::io::MonitorIo",
    "seismograph_protocol::monitor::MonitorDescriptor",
]

[features]
monitor = ["dep:seismograph_protocol"]
test-util = ["monitor", "seismograph_protocol/test-util"]

[dependencies]
seismograph_protocol = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Diagnostics_Debug"] }

[dev-dependencies]
mutants.workspace = true
seismograph_protocol = { path = "../seismograph_protocol", features = ["test-util"] }

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
