[package]
name = "arty"
description = "Single-threaded, thread-aware application runtime."
version = "0.5.0"
readme = "README.md"
keywords = ["arty", "async", "runtime"]
categories = ["asynchronous"]
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
include = { workspace = true }
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/arty"

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "arty_io_core::io_context::IoContext",
    "arty_macros::main",
    "arty_macros::test",
    "observed::sink::core::Sink",
    "thread_aware_core::thread::NumaNode",
    "thread_aware_core::thread::Owner",
    "thread_aware_core::thread::Thread",
    "thread_aware_core::thread_aware::ThreadAware",
    "tick::clock::Clock",
    "tick::clock_control::ClockControl",
    "tick::runtime::inactive_clock::InactiveClock",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["rt", "macros"]
macros = ["rt", "dep:arty_macros"]
rt = [
    "time",
    "dep:arty_executor",
    "dep:arty_io_host",
    "dep:data_privacy",
    "dep:derive_more",
    "dep:events_once",
    "dep:foldhash",
    "dep:futures",
    "dep:many_cpus",
    "dep:nonempty",
    "dep:observed",
    "dep:ohno",
    "dep:performables",
    "dep:pin-project",
    "dep:thread_aware",
]
time = ["dep:tick"]
test-util = ["tick?/test-util", "many_cpus?/test-util"]

[dependencies]
arty_executor = { workspace = true, optional = true }
arty_io_core = { workspace = true }
arty_io_host = { workspace = true, optional = true }
arty_macros = { workspace = true, optional = true }
data_privacy = { workspace = true, optional = true }
derive_more = { workspace = true, features = ["debug"], optional = true }
events_once = { workspace = true, optional = true }
foldhash = { workspace = true, features = ["std"], optional = true }
futures = { workspace = true, features = ["executor"], optional = true }
many_cpus = { workspace = true, optional = true }
nonempty = { workspace = true, optional = true }
observed = { workspace = true, optional = true }
ohno = { workspace = true, optional = true }
performables = { workspace = true, optional = true }
pin-project = { workspace = true, optional = true }
thread_aware = { workspace = true, features = ["std", "derive"], optional = true }
thread_aware_core = { workspace = true, features = ["std"] }
tick = { workspace = true, optional = true }

[dev-dependencies]
arty_executor = { path = "../arty_executor" }
arty_io_host = { path = "../arty_io_host" }
arty_macros = { path = "../arty_macros" }
bolero = { workspace = true, features = ["std"] }
criterion = { workspace = true }
ctor = { workspace = true }
data_privacy = { path = "../data_privacy" }
derive_more = { workspace = true, features = ["debug"] }
events_once = { workspace = true }
foldhash = { workspace = true, features = ["std"] }
futures = { workspace = true, features = ["executor", "async-await"] }

gungraun = { workspace = true, features = ["default"] }
many_cpus = { workspace = true, features = ["test-util"] }
metabench = { path = "../metabench" }
mutants = { workspace = true }
nonempty = { workspace = true }
observed = { path = "../observed", features = ["test-util"] }
observed_testing = { path = "../observed_testing" }
ohno = { path = "../ohno", features = ["app-err"] }
performables = { path = "../performables" }
pin-project = { workspace = true }
scopeguard = { workspace = true }
static_assertions = { workspace = true }
testing_aids = { path = "../testing_aids" }
thread_aware = { path = "../thread_aware", features = ["std", "derive", "test-utils"] }
tick = { path = "../tick", features = ["test-util"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "sync"] }

[[test]]
name = "io"
path = "tests/io/main.rs"

[[test]]
name = "panic"
path = "tests/panic/main.rs"

[[bench]]
name = "arty_scheduling"
harness = false
required-features = ["rt"]

[[bench]]
name = "arty_contention"
harness = false
required-features = ["rt"]

[[bench]]
name = "arty_telemetry"
harness = false
required-features = ["rt"]

[[example]]
name = "arty_advanced"
required-features = ["rt"]

[[example]]
name = "arty_basic"
required-features = ["macros"]

[[example]]
name = "arty_io"
required-features = ["macros"]

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
