[package]
name = "fetch_azure"
description = "Uses the fetch HTTP client as the HTTP transport for Azure SDK clients."
version = "0.10.0"
readme = "README.md"
keywords = ["oxidizer", "azure", "fetch", "http", "transport"]
categories = ["network-programming"]

edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
include = { workspace = true }
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/fetch_azure"

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    # Crates in this workspace
    "fetch::*",
    # azure_core re-exports HttpClient from typespec_client_core.
    # cargo-check-external-types reports the crate that defines each re-export.
    "typespec_client_core::*",
]

[package.metadata.docs.rs]
all-features = true

[package.metadata.anvil.examples]
# This example needs a live Azure account and developer credentials.
no-run = ["blob_list"]

[dependencies]

# external
async-trait = { workspace = true }
azure_core = { workspace = true }
# internal
bytesbuf = { workspace = true, features = ["bytes-compat", "std"] }
fetch = { workspace = true }
futures = { workspace = true, features = ["std"] }
http = { workspace = true }
layered = { workspace = true }

[dev-dependencies]
# internal
anyspawn = { path = "../anyspawn", features = ["tokio"] }
anyspawn_azure = { path = "../anyspawn_azure", features = ["azure-identity"] }

# external
async-trait = { workspace = true }
azure_core = { workspace = true }
azure_identity = { workspace = true }
azure_storage_blob = { workspace = true }
fetch = { path = "../fetch", features = ["test-util", "tokio", "rustls"] }
futures = { workspace = true, features = ["std"] }
tick = { path = "../tick", features = ["tokio"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
