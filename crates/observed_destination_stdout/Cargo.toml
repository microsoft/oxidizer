[package]
name = "observed_destination_stdout"
description = "stdout destination for Observed pipeline."
version = "0.1.0"
readme = "README.md"
keywords = ["observed", "telemetry", "tracing", "logging", "metrics"]
categories = ["development-tools::debugging"]

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
include.workspace = true
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/observed_destination_stdout"

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "bon::builder_state::IsUnset",
    "log::LevelFilter",
    "observed_destination_core::format::LogFormatConfig",
    "observed_destination_core::IntoLogDestination",
    "observed_destination_core::IntoMetricDestination",
    "observed_destination_core::LogDestination",
    "observed_destination_core::MetricDestination",
]

[package.metadata.docs.rs]
all-features = true

[dependencies]

# 3rd-party
bon = { workspace = true }
derive_more = { workspace = true, features = ["debug"] }
log = { workspace = true }
# ox-sdk
observed_destination_core = { workspace = true }
opentelemetry = { workspace = true, features = ["logs"] }
opentelemetry-stdout = { workspace = true, features = ["metrics"] }
opentelemetry_sdk = { workspace = true, features = ["logs", "metrics"] }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
performables = { path = "../performables", default-features = false }
static_assertions.workspace = true

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
