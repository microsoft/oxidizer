[package]
name = "observed_destination_stdout"
description = "stdout destination for Observed pipeline."
version = "0.1.0"
readme = "README.md"
keywords = ["oxidizer", "observed", "telemetry", "tracing", "logging", "metrics"]
categories = ["development-tools::debugging"]

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
include.workspace = true
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/observed_destination_stdout"

[package.metadata.docs.rs]
all-features = true

[dependencies]

# 3rd-party
bon = { workspace = true }
log = { workspace = true }
# ox-sdk
observed_destination_core = { path = "../observed_destination_core" }
opentelemetry = { workspace = true, features = ["logs"] }
opentelemetry-stdout = { workspace = true, features = ["metrics"] }
opentelemetry_sdk = { workspace = true, features = ["logs", "metrics"] }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
performables = { workspace = true }

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
