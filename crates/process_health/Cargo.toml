[package]
name = "process_health"
description = "Application health aggregation with component reports."
version = "0.1.0"
readme = "README.md"
keywords = ["health", "readiness", "diagnostics"]
categories = ["asynchronous"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
include.workspace = true
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/process_health"

[package.metadata.cargo_check_external_types]
allowed_external_types = ["observed::sink::core::Sink", "thread_aware_core::thread_aware::ThreadAware"]

[lib]
name = "health"

[features]
default = []

[dependencies]
arc-swap.workspace = true
data_privacy.workspace = true
foldhash = { workspace = true, features = ["std"] }
observed.workspace = true
performables.workspace = true
thread_aware = { workspace = true, features = ["std"] }

[dev-dependencies]
future_assert = { path = "../future_assert" }
futures = { workspace = true, features = ["executor"] }
observed_testing = { path = "../observed_testing" }
static_assertions.workspace = true
testing_aids = { path = "../testing_aids" }

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
