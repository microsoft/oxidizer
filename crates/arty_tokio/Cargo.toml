[package]
name = "arty_tokio"
description = "Lets Arty tasks use Tokio-based libraries."
version = "0.2.1"
readme = "README.md"
keywords = ["arty", "async", "runtime", "tokio"]
categories = ["asynchronous"]
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
include = { workspace = true }
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/arty_tokio"

# Tokio's enabled I/O drivers call operating-system APIs that Miri cannot
# interpret. Native tests, coverage, cargo careful, and Tokio's own Miri suite
# retain the relevant behavior and unsafe-code coverage.
[package.metadata.anvil.miri]
exclude = true

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "arty::runtime::builder::RuntimeBuilder",
    "arty::runtime::control::RuntimeControl",
    "tokio::runtime::handle::Handle",
    "tokio::runtime::runtime::Runtime",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = []

[dependencies]
arty = { workspace = true, features = ["rt"] }
derive_more = { workspace = true, features = ["debug"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }

[dev-dependencies]
arty = { path = "../arty", features = ["macros", "rt"] }
static_assertions = { workspace = true }
tokio = { workspace = true, features = ["io-util", "rt-multi-thread"] }

[[example]]
name = "arty_tokio_basic"

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
