[package]
name = "fetch_winhttp_testing"
description = "Localhost fixtures, integration tests, examples and benchmarks for fetch_winhttp (Windows only)."
version = "0.0.0"
publish = false

edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
include = { workspace = true }

[package.metadata.cargo_check_external_types]
# Internal crate (publish = false; listed in automation::INTERNAL_CRATES). Its
# public surface intentionally re-exposes the fetch/http/bytes types the
# fixtures are scripted and observed with.
#
# This is NOT redundant with INTERNAL_CRATES membership: that list is only read
# by scripts/check-external-types.rs (the `external-type-exposure` job). The
# `anvil-external-types` recipe behind `pr-fast` scopes itself from cargo
# metadata and never consults it, so without this block that job fails.
allowed_external_types = ["*"]

# Fixture crate: its library is scaffolding driven by the tests it hosts, and
# some of it exists only for the benchmarks and examples, which the coverage run
# does not execute. It is measured rather than opted out, because opting out
# would remove the package - and with it the transport's integration tests - from
# the measured set entirely.
[package.metadata.coverage-gate]
min-lines-percent = 90

# `ctor` is used only through the `testing_aids::init_tracing!` macro expansion
# (`#[::ctor::ctor]`), which cargo-machete's source scan does not see; ignore it
# to avoid a false positive.
[package.metadata.cargo-machete]
ignored = ["ctor"]

[target.'cfg(windows)'.dependencies]
bytes = { workspace = true }
bytesbuf = { workspace = true }
fetch = { workspace = true }
fetch_winhttp = { path = "../fetch_winhttp" }
futures = { workspace = true, features = ["std"] }
h3 = { workspace = true }
h3-quinn = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
http_extensions = { workspace = true }
hyper = { workspace = true, features = ["http1", "http2", "server"] }
hyper-util = { workspace = true, features = [
    "http1",
    "http2",
    "server-auto",
    "tokio",
] }
observed = { workspace = true }
quinn = { workspace = true, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rcgen = { workspace = true, features = ["aws_lc_rs"] }
rustls = { workspace = true, features = ["aws-lc-rs", "std", "tls12"] }
rustls-pki-types = { workspace = true, features = ["std"] }
tick = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = [
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs", "tls12"] }

# The benchmark harness is not target-gated: `--all-targets` builds benchmark
# targets on every platform, so these must resolve even where the benchmark body
# itself compiles away.
[dev-dependencies]
all_the_time = { workspace = true }
alloc_tracker = { workspace = true }
benchmarking = { path = "../benchmarking" }
criterion = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
ctor = { workspace = true }
futures = { workspace = true, features = ["executor"] }
testing_aids = { path = "../testing_aids" }

[[bench]]
name = "fw_request"
harness = false

[[bench]]
name = "fw_client"
harness = false

[lints]
workspace = true
