[package]
name = "observed_perf_counters"
description = "Native Windows performance-counter publishing for typed observed integer metrics."
version = "0.1.0"
readme = "README.md"
keywords = ["observed", "telemetry", "windows", "performance", "counters"]
categories = ["development-tools::debugging", "os::windows-apis"]

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
include.workspace = true
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/observed_perf_counters"

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "observed::event::Event",
    "observed::error::FlushError",
    "observed::metadata::event::EventDescription",
    "observed::processing::event_view::EventView",
    "observed::processing::processor::EventProcessor",
]

[package.metadata.docs.rs]
all-features = true

[dependencies]
observed = { workspace = true }
performables = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["std", "v5"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Performance"] }

[dev-dependencies]
ctor = { workspace = true }
testing_aids = { workspace = true }
tick = { workspace = true, features = ["test-util"] }

[target.'cfg(all(windows, target_pointer_width = "64"))'.dev-dependencies]
alloc_tracker = { workspace = true }

[lints]
workspace = true
