[package]
name = "arty_executor"
description = "Single-threaded async task executor for the Arty runtime."
version = "0.5.0"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
readme = "README.md"
homepage = { workspace = true }
include = { workspace = true }
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/arty_executor"
keywords = ["arty", "executor", "async", "runtime"]
categories = ["asynchronous"]

[package.metadata.release-plan]
private-api = true

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "observed::context::transfer::Transfer",
    "observed::sink::core::Sink",
    "thread_aware_core::thread::Thread",
]

[features]
inspection = []

[dependencies]
data_privacy = { workspace = true }
derive_more = { workspace = true, features = ["debug"] }
nm = { workspace = true }
observed = { workspace = true }
ohno = { workspace = true }
performables = { workspace = true }
pin-project = { workspace = true }
plurality = { workspace = true }
thread_aware_core = { workspace = true, features = ["std"] }
tick = { workspace = true, features = ["fast-instant"] }

[dev-dependencies]
alloc_tracker = { workspace = true }
criterion = { workspace = true }
gungraun = { workspace = true, features = ["default"] }
metabench = { path = "../metabench", default-features = false }
mutants = { workspace = true }
observed_testing = { path = "../observed_testing" }
static_assertions = { workspace = true }
thread_aware = { path = "../thread_aware", default-features = false, features = ["std"] }

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints

[[bench]]
name = "ae_basic_operations"
harness = false
