[package]
name = "arty_executor"
description = "Single-threaded async task executor for the Arty runtime."
version = "0.1.2"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
readme = "README.md"
homepage = { workspace = true }
include = { workspace = true }
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/arty_executor"
keywords = ["arty", "executor", "async", "runtime"]
categories = ["asynchronous"]

[package.metadata.cargo_check_external_types]
allowed_external_types = ["scopeguard::*"]

[features]
default = []
test-util = ["dep:scopeguard"]

[dependencies]
events_once = { workspace = true }
foldhash = { workspace = true, features = ["std"] }
infinity_pool = { workspace = true }
nm = { workspace = true }
pin-project = { workspace = true }
scopeguard = { workspace = true, optional = true }
tick = { workspace = true, features = ["fast-instant"] }

[dev-dependencies]
criterion = { workspace = true }
derive_more = { workspace = true, features = ["debug"] }
gungraun = { workspace = true, features = ["default"] }
metabench = { workspace = true }
mockall = { workspace = true }
mutants = { workspace = true }
scopeguard = { workspace = true }
static_assertions = { workspace = true }
testing_aids = { path = "../testing_aids" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints

[[bench]]
name = "ae_basic_operations"
harness = false
required-features = ["test-util"]
