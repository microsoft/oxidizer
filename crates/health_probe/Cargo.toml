[package]
name = "health_probe"
description = "Readiness adapters for health."
version = "0.1.0"
readme = "README.md"
keywords = ["health", "readiness", "kubernetes", "http", "tcp"]
categories = ["asynchronous", "web-programming::http-server"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
include.workspace = true
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/health_probe"

[package.metadata.cargo_check_external_types]
# The crate is an interoperability adapter over these public contracts.
allowed_external_types = [
    "health::aggregator::Monitor",
    "http::request::Request",
    "http::response::Response",
    "http_extensions::request_handler::RequestHandler",
    "tick::clock::Clock",
    "tower_service::Service",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
http = ["dep:http", "dep:tower-service"]
request-handler = ["dep:bytesbuf", "dep:http", "dep:http_extensions", "dep:layered", "dep:tick"]
tcp = ["dep:tick", "dep:tokio"]

[dependencies]
bytesbuf = { workspace = true, optional = true, features = ["std"] }
http = { workspace = true, optional = true }
http_extensions = { workspace = true, optional = true }
layered = { workspace = true, optional = true }
process_health.workspace = true
tick = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["macros", "net"] }
tower-service = { workspace = true, optional = true }

[dev-dependencies]
bytesbuf = { path = "../bytesbuf", default-features = false, features = ["std"] }
futures = { workspace = true, features = ["executor"] }
http.workspace = true
http_extensions = { path = "../http_extensions", default-features = false, features = ["test-util"] }
layered = { path = "../layered", default-features = false }
observed = { path = "../observed" }
tick = { path = "../tick", default-features = false, features = ["test-util"] }
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }
tower = { workspace = true, features = ["util"] }
tower-service.workspace = true

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
