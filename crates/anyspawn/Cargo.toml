[package]
name = "anyspawn"
description = "A task spawner for Arty and Tokio."
version = "0.11.0"
readme = "README.md"
keywords = ["oxidizer", "async", "runtime", "futures"]
categories = ["asynchronous"]

edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
include = { workspace = true }
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/anyspawn"

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "arty::task::scheduler::Scheduler",
    "observed::sink::core::Sink",
    "ohno::*",
    "tokio::runtime::handle::Handle",
    "thread_aware_core::thread_aware::ThreadAware",
    "thread_aware_core::thread::Thread",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
arty = ["dep:arty"]
observed = ["dep:observed"]
seismograph = ["observed?/seismograph"]
tokio = ["dep:tokio"]

[dependencies]
arty = { workspace = true, features = ["rt"], optional = true }
observed = { workspace = true, optional = true }
ohno = { workspace = true }
thread_aware = { workspace = true, features = ["derive", "std"] }
tokio = { workspace = true, features = ["rt"], optional = true }

[dev-dependencies]
arty = { path = "../arty", default-features = false, features = ["rt"] }
criterion = { workspace = true }
ctor = { workspace = true }
futures = { workspace = true, features = ["executor"] }
many_cpus = { workspace = true }
observed = { path = "../observed" }
observed_testing = { path = "../observed_testing" }
static_assertions = { workspace = true }
testing_aids = { path = "../testing_aids" }
thread_aware = { path = "../thread_aware", default-features = false, features = ["test-utils"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[[test]]
name = "arty"
required-features = ["arty"]

[[test]]
name = "spawner"
required-features = ["tokio"]

[[test]]
name = "handle"
required-features = ["tokio"]

[[bench]]
name = "spawner"
harness = false
required-features = ["tokio"]

[[example]]
name = "anyspawn_arty"
required-features = ["arty"]

[[example]]
name = "anyspawn_tokio"
required-features = ["tokio"]

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
