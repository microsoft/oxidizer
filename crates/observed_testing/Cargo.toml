[package]
name = "observed_testing"
description = "Test harness and integration tests for the observed crate family."
version = "0.0.0"
publish = false

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
include.workspace = true

[package.metadata.cargo_check_external_types]
# Internal crate (publish = false; listed in automation::INTERNAL_CRATES). Not a
# public-API surface, so allow all external types — this opts the crate into the
# external-types check permissively rather than denying its intentional
# re-exposure of the observed/data_privacy types it is a test harness for.
allowed_external_types = ["*"]

[dependencies]
data_privacy = { workspace = true }
observed = { workspace = true, features = ["test-util"] }
tick = { workspace = true, features = ["test-util"] }

[dev-dependencies]
opentelemetry = { workspace = true, features = ["logs"] }
testing_aids = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }

[lints]
workspace = true
