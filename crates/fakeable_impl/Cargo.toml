[package]
name = "fakeable_impl"
description = "Implementation details for the fakeable procedural macros."
version = "0.2.0"
readme = "README.md"
keywords = ["oxidizer", "fake", "mock", "testing"]
categories = ["development-tools::testing", "rust-patterns"]

edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
include = { workspace = true }
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/fakeable_impl"

[package.metadata.anvil.miri]
exclude = true

[package.metadata.cargo_check_external_types]
allowed_external_types = ["proc_macro2::*", "syn::error::*"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
mockall = ["dep:mockall"]

[dependencies]
mockall = { workspace = true, optional = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["clone-impls", "extra-traits", "full", "parsing", "printing", "proc-macro"] }

[dev-dependencies]
insta = { workspace = true }
mutants = { workspace = true }
prettyplease = { workspace = true }

[[test]]
name = "output_verification"
required-features = ["mockall"]

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
