[package]
name = "metabench"
description = "Run Criterion, Gungraun, Linux perf, Intel VTune, and allocation benchmarks together and combine their reports."
version = "0.3.0"
readme = "README.md"
keywords = ["benchmark", "criterion", "callgrind", "gungraun", "oxidizer"]
categories = ["development-tools::profiling"]

edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
include = { workspace = true }
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/metabench"

[package.metadata.anvil.miri]
exclude = true

[package.metadata.coverage-gate]
min-lines-percent = 1

[package.metadata.cargo_check_external_types]
allowed_external_types = ["criterion", "gungraun", "metabench_macros::*"]

[package.metadata.docs.rs]
all-features = true

[lib]
bench = false

[dependencies]
alloc_tracker = { workspace = true }
clap = { workspace = true, features = ["std"] }
command-group = { workspace = true }
criterion = { workspace = true }
either-or-both = { workspace = true }
gungraun = { workspace = true, features = ["default"] }
# Parse summaries with the matching runner, avoiding a separately resolved wrapper.
gungraun-runner = { workspace = true, features = ["summary"] }
jiff = { workspace = true, features = ["std"] }
metabench_macros = { workspace = true }
ohno = { workspace = true }
regex = { workspace = true, features = ["std", "perf", "unicode"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
tempfile = { workspace = true, features = ["getrandom"] }
terminal_size = { workspace = true }
unicode-width = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["fs", "poll"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Pipes"] }

[dev-dependencies]
bolero = { workspace = true, features = ["std"] }

[target.'cfg(not(target_os = "linux"))'.dev-dependencies]
mutants = { workspace = true }

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
