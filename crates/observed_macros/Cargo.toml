[package]
name = "observed_macros"
description = "Procedural macros for the observed crate. You should not add this as a direct dependency; use the re-exports from observed."
version = "0.24.0"
readme = "README.md"
keywords = ["observed", "proc-macro", "macros", "telemetry", "events"]
categories = ["development-tools::debugging"]

edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
include = { workspace = true }
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/observed_macros"

[package.metadata.cargo_check_external_types]
allowed_external_types = []

[package.metadata.docs.rs]
all-features = true

# Thin proc-macro entry crate: the only coverage source for `#[proc_macro_attribute]`
# entry points is compile-time expansion in consumers, which is non-deterministic under
# impact-scoped `cargo llvm-cov nextest`. The shims carry `#[coverage(off)]` and the
# delegated logic lives in `observed_macros_impl` (gated normally), so this crate reports
# no instrumented lines; opt it out of the per-package line gate.
[package.metadata.coverage-gate]
min-lines-percent = 0

[lib]
proc-macro = true

[dependencies]
observed_macros_impl = { workspace = true }

[dev-dependencies]
mutants = { workspace = true }

[lints]
workspace = true
