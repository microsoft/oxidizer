[package]
name = "fundle_macros_impl"
description = "Macros for the fundle crate."
version = "0.4.1"
readme = "README.md"
keywords = ["oxidizer", "di", "proc-macro"]
categories = ["rust-patterns"]

edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
include = { workspace = true }
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/fundle_macros_impl"

[package.metadata.release-plan]
private-api = true

[package.metadata.anvil.miri]
exclude = true

[package.metadata.cargo_check_external_types]
allowed_external_types = ["proc_macro2::*", "syn::error::*"]

[package.metadata.docs.rs]
all-features = true

# ctor is referenced by the tracing initializer macro expansion, not by source code.
[package.metadata.cargo-machete]
ignored = ["ctor"]

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["derive", "parsing", "proc-macro", "full", "extra-traits", "printing"] }

[dev-dependencies]
ctor = { workspace = true }
insta = { workspace = true }
mutants = { workspace = true }
syn = { workspace = true, features = ["derive", "parsing", "proc-macro", "full", "extra-traits", "printing", "clone-impls"] }
testing_aids = { path = "../testing_aids" }

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
