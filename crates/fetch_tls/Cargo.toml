[package]
name = "fetch_tls"
description = "TLS configuration for the fetch crate."
version = "0.5.1"
readme = "README.md"
keywords = ["oxidizer", "tls", "fetch", "http", "client"]
categories = ["network-programming"]

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
include.workspace = true
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/fetch_tls"

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    # ohno macro-generated trait impls
    "ohno::enrichable::Enrichable",
    "ohno::error_ext::ErrorExt",
    # External dependencies in the public API
    "http::uri::authority::Authority",
    "http::version::Version",
    # TLS backends, gated by features
    "rustls::client::client_conn::ClientConfig",
    "rustls::client::client_conn::ResolvesClientCert",
    "rustls::crypto::CryptoProvider",
    "rustls::verify::ServerCertVerifier",
    "native_tls::Certificate",
    "native_tls::TlsConnector",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
rustls = ["dep:rustls"]
native-tls = ["dep:native-tls"]

[dependencies]

# external
base64 = { workspace = true }
http = { workspace = true }
native-tls = { workspace = true, optional = true, features = ["alpn"] }
# internal
ohno = { workspace = true }
# This crate does not enable a crypto provider feature. Applications can set a
# provider on `TlsOptionsBuilder`. Client libraries can set a default through
# `TlsBackendBuilder::configure_rustls`.
rustls = { workspace = true, features = [
    "tls12",
    "std",
], default-features = false, optional = true }
rustls-pki-types = { workspace = true, features = ["alloc", "std"] }

[dev-dependencies]
insta = { workspace = true }
native-tls = { workspace = true, features = ["alpn"] }
rstest = { workspace = true }
# Tests always use both backends. This development dependency lets `cargo test`
# work when no features are enabled.
rustls = { workspace = true, features = ["tls12", "std", "aws-lc-rs"], default-features = false }
static_assertions = { workspace = true }

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
