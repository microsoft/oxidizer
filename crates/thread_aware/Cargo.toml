[package]
name = "thread_aware"
description = "Facilities to support thread-isolated state."
version = "0.9.0"
readme = "README.md"
keywords = ["oxidizer", "thread", "aware"]
categories = ["data-structures", "no-std"]

edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
include = { workspace = true }
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/thread_aware"

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "thread_aware_core::Affinity",
    "thread_aware_core::ThreadAware",
    "thread_aware_macros::ThreadAware",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std", "derive"]
# Enables the per-affinity Arc and hosted-only closure support. Disable for `#![no_std]`
# environments; the crate then requires only `alloc`.
std = []
derive = ["dep:thread_aware_macros"]
threads = ["std", "dep:many_cpus"]

[dependencies]
many_cpus = { workspace = true, optional = true }
thread_aware_core = { workspace = true }

thread_aware_macros = { workspace = true, optional = true }

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
many_cpus = { workspace = true, features = ["test-util"] }
mutants = { workspace = true }
thread_aware_macros = { path = "../thread_aware_macros" }

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
