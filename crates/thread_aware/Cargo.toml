[package]
name = "thread_aware"
description = "Facilities to support thread-isolated state."
version = "0.11.0"
readme = "README.md"
keywords = ["oxidizer", "thread", "aware"]
categories = ["data-structures", "no-std"]

edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
include = { workspace = true }
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/thread_aware"

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "thread_aware_macros::ThreadAware",
    # Core vocabulary, re-exported from `thread_aware_core`.
    "thread_aware_core::thread_aware::ThreadAware",
    "thread_aware_core::thread::Thread",
    "thread_aware_core::thread::Owner",
    "thread_aware_core::thread::NumaNode",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std", "derive"]
std = ["dep:dashmap", "dep:rustc-hash", "thread_aware_core/std"]
derive = ["dep:thread_aware_macros"]

[dependencies]
dashmap = { workspace = true, optional = true }
rustc-hash = { workspace = true, optional = true }

thread_aware_core = { workspace = true }
thread_aware_macros = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
futures = { workspace = true, features = ["executor"] }
mutants = { workspace = true }
static_assertions = { workspace = true }
thread_aware_macros = { path = "../thread_aware_macros" }

# These integration tests exercise `#[derive(ThreadAware)]`, so they compile only
# when the `derive` feature is enabled. Gating them keeps every additive feature
# combination (for example `--no-default-features --features std`) buildable.
[[test]]
name = "derive_compiles"
required-features = ["derive"]

[[test]]
name = "transfer_pass"
required-features = ["derive"]

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
