[package]
name = "compressors"
version = "0.3.0"
description = "Streaming compression and decompression over bytesbuf byte sequences"
readme = "README.md"
keywords = ["compression", "gzip", "streaming", "zero-copy"]
categories = ["compression", "network-programming"]
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
include = { workspace = true }
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/compressors"

# Miri cannot run all of this crate's backends. `zstd-safe` binds the native zstd library. Miri
# cannot call foreign functions. The `flate2` `zlib-rs` backend has an open soundness bug that trips
# Stacked Borrows whenever a Deflate or Inflate is dropped
# (https://github.com/trifectatechfoundation/zlib-rs/issues/491). Brotli is pure Rust and can run
# under Miri. The crate is excluded because a brotli-only Miri configuration requires extensive
# per-format `cfg(miri)` branches for limited additional coverage.
[package.metadata.anvil.miri]
exclude = true

[package.metadata.docs.rs]
all-features = true

# `cfg_aliases` is used only by `build.rs`. cargo-machete does not scan build
# scripts, so it reports a false positive. Ignore it here.
[package.metadata.cargo-machete]
ignored = ["cfg_aliases"]

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "bytesbuf::*",
    "futures_core::stream::Stream",
    "recoverable::*",
    "thread_aware_core::thread_aware::ThreadAware",
]

[features]
brotli = ["dep:brotli"]
# No format is enabled by default. A dependent selects the formats that it uses. A build that only
# needs brotli does not compile flate2. A build with no format still gets the shared contract and
# builders.
default = []
deflate = ["dep:flate2"]
futures-stream = ["dep:futures-core", "dep:pin-project-lite"]
gzip = ["dep:flate2"]
zlib = ["dep:flate2"]
zstd = ["dep:zstd-safe"]

[dependencies]
brotli = { workspace = true, features = ["std"], optional = true }
bytesbuf = { workspace = true, features = ["std"] }
# Use `zlib-rs` instead of the flate2 default, `miniz_oxide`. It is the fastest flate2 backend.
# Unlike the `zlib` and `zlib-ng` bindings, it is pure Rust. The soundness issue above prevents
# Miri validation.
flate2 = { workspace = true, features = ["zlib-rs"], optional = true }
foldhash = { workspace = true }
futures-core = { workspace = true, optional = true }
performables = { workspace = true }
pin-project-lite = { workspace = true, optional = true }
recoverable = { workspace = true }
thread_aware = { workspace = true, features = ["std"] }
zstd-safe = { workspace = true, features = ["std"], optional = true }

[build-dependencies]
cfg_aliases = { workspace = true }

[dev-dependencies]
bolero = { workspace = true, features = ["std"] }
brotli = { workspace = true, features = ["std"] }
bytesbuf = { path = "../bytesbuf", features = ["std", "test-util"] }
criterion = { workspace = true }
flate2 = { workspace = true, features = ["zlib-rs"] }
futures = { workspace = true, features = ["executor"] }
futures-core = { workspace = true }
metabench = { path = "../metabench" }
mutants = { workspace = true }
pin-project-lite = { workspace = true }
thread_aware = { path = "../thread_aware", default-features = false, features = ["std", "test-utils"] }
tick = { path = "../tick", features = ["tokio", "test-util"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-stream = { workspace = true }
zstd-safe = { workspace = true, features = ["std"] }

[[example]]
name = "round_trip"
required-features = ["brotli", "deflate", "gzip", "zlib", "zstd"]

[[example]]
name = "tokio_stream"
required-features = ["futures-stream", "gzip"]

[[bench]]
harness = false
name = "compressors_codec"
required-features = ["brotli", "deflate", "futures-stream", "gzip", "zlib", "zstd"]

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
