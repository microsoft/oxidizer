[package]
name = "seismograph_runtime"
version = "0.5.0"
description = "Process-wide multi-runtime telemetry source for seismograph."
readme = "README.md"
keywords = ["runtime", "telemetry", "diagnostics", "profiling"]
categories = ["development-tools::debugging"]

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
include.workspace = true
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/seismograph_runtime"

# This safe integration layer delegates recording and snapshots to seismograph,
# whose unsafe implementation retains direct Miri coverage.
[package.metadata.anvil.miri]
exclude = true

[package.metadata.cargo_check_external_types]
allowed_external_types = ["seismograph::*"]

[features]
test-util = ["tick/test-util"]

[dependencies]
seismograph.workspace = true
tick.workspace = true

[dev-dependencies]
mutants.workspace = true
static_assertions.workspace = true
tick = { path = "../tick", features = ["test-util"] }

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
