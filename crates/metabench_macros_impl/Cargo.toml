[package]
name = "metabench_macros_impl"
description = "Implementation and tests for metabench procedural macros."
version = "0.1.0"
readme = "README.md"
keywords = ["benchmark", "criterion", "callgrind", "perf", "oxidizer"]
categories = ["development-tools::profiling"]

edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
include = { workspace = true }
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/metabench_macros_impl"

[package.metadata.anvil.miri]
exclude = true

[package.metadata.cargo_check_external_types]
allowed_external_types = ["proc_macro2::TokenStream", "syn::error::Result"]

[package.metadata.docs.rs]
all-features = true

[lib]
bench = false

[dependencies]
heck = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn2 = { workspace = true, features = ["full", "parsing", "printing", "proc-macro"] }

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
