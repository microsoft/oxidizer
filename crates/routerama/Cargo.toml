[package]
name = "routerama"
version = "0.1.0"
description = "Blazingly fast HTTP routing, response composition, and query/form processing"
readme = "README.md"
keywords = ["http", "router", "routing", "path", "url"]
categories = ["web-programming", "network-programming"]

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
include.workspace = true
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/routerama"

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    # Canonical `response` contracts deliberately expose these ecosystem types.
    "bytes::*",
    "bytesbuf::*",
    "headers::*",
    "http::*",
    "http_body::*",
    # Other feature-gated modules expose their macro and codec types.
    "routerama_macros::*",
    "serde_core::*",
    "serde_json::*",
    # The `tower` transport adapter implements this ecosystem trait by design.
    "tower_service::Service",
]

[package.metadata.docs.rs]
all-features = true

# `ctor` is used only through the `testing_aids::init_tracing!` macro expansion
# (`#[::ctor::ctor]`), which cargo-machete's source scan does not see; ignore it
# to avoid a false positive.
[package.metadata.cargo-machete]
ignored = ["ctor"]

[features]
default = []
bytesbuf = ["dep:bytesbuf", "bytesbuf/bytes-compat", "response"]
bytesbuf-std = ["bytesbuf", "bytesbuf/std", "serde_json?/std"]
form = ["route", "query"]
json = ["route", "dep:serde", "dep:serde_json"]
mount = ["route"]
query = ["dep:itoa", "dep:routerama_macros", "routerama_macros/query"]
resolve = [
    "dep:http_path_template",
    "dep:routerama_build",
    "dep:routerama_macros",
    "dep:smallvec",
    "routerama_macros/resolve",
]
response = ["dep:bytes", "dep:http", "dep:http-body", "dep:pin-project-lite"]
route = [
    "dep:headers",
    "dep:http_path_template",
    "dep:routerama_build",
    "dep:routerama_macros",
    "dep:smallvec",
    "response",
    "routerama_macros/route",
]
tower = ["dep:tower-service", "route", "routerama_macros/tower"]

[dependencies]
bytes = { workspace = true, optional = true }
bytesbuf = { workspace = true, default-features = false, optional = true }
headers = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
http_path_template = { workspace = true, optional = true }
itoa = { workspace = true, optional = true }
pin-project-lite = { workspace = true, optional = true }
routerama_build = { workspace = true, default-features = false, optional = true }
routerama_macros = { workspace = true, default-features = false, optional = true }
serde = { workspace = true, features = ["alloc"], optional = true }
serde_json = { workspace = true, features = ["alloc"], optional = true }
smallvec = { workspace = true, optional = true }
tower-service = { workspace = true, optional = true }

[dev-dependencies]
# Full-framework comparison fixtures remain dev-only; their workspace entries
# disable default features.
actix-web = { workspace = true }
alloc_tracker = { workspace = true }
# `axum` powers the `web_app` example; its `json` and `form` features are used
# only by the bounded-body and bounded-form comparison fixtures. It remains a
# dev-only HTTP transport.
axum = { workspace = true, features = ["tokio", "http1", "json", "form", "query"] }
# Do not add actix-router here: its unconditional tracing/log feature changes
# workspace-wide coverage instrumentation for unrelated telemetry call sites.
bolero = { workspace = true, features = ["std"] }
# `std` transitively enables `bolero-engine/any`, which is required
# because bolero-libfuzzer references `bolero_engine::any::run` but does
# not itself activate that feature on `bolero-engine`.
criterion = { workspace = true }
ctor = { workspace = true }
futures-core = { workspace = true }
http-body-util = { workspace = true }
http_extensions = { workspace = true, features = ["test-util"] }
hyper = { workspace = true, features = ["http1", "server"] }
matchit = { workspace = true }
mutants = { workspace = true }
path-tree = { workspace = true }
regex = { workspace = true, features = ["std", "perf"] }
# Rocket's JSON support is used only by the bounded-body comparison fixture.
rocket = { workspace = true, features = ["json"] }
route-recognizer = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_html_form = { workspace = true, features = ["de", "ser", "std"] }
serde_urlencoded = { workspace = true }
testing_aids = { path = "../testing_aids" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
# `tower` supplies `ServiceBuilder` and the layers used by the `tower_service`
# example and tests. It is a dev-only transport composition helper: the library
# itself depends only on the `tower-service` trait definition.
tower = { workspace = true, features = ["limit", "util"] }
tower-service = { workspace = true }
# `tracing` and `tracing-subscriber` are used only by the `auth_tracing`
# example and its test. The library emits no telemetry of its own.
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["fmt", "registry"] }
trybuild = { workspace = true }
warp = { workspace = true, features = ["server"] }

# Callgrind instruction-count benchmarks (Valgrind is Linux-only).
[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun = { workspace = true, features = ["default"] }

[lints]
workspace = true

