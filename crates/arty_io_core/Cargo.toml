[package]
name = "arty_io_core"
description = "Stable contracts for integrating external I/O drivers with the Arty runtime."
version = "0.2.0"
readme = "README.md"
keywords = ["arty", "async", "runtime"]
categories = ["asynchronous"]
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
include = { workspace = true }
repository = "https://github.com/microsoft/oxidizer/tree/main/crates/arty_io_core"

[package.metadata.docs.rs]
all-features = true

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "thread_aware_core::thread::NumaNode",
    "thread_aware_core::thread::Owner",
    "thread_aware_core::thread::Thread",
    "thread_aware_core::thread_aware::ThreadAware",
]

[features]
default = []

[dependencies]
thread_aware_core = { workspace = true, features = ["std"] }

[dev-dependencies]
static_assertions = { workspace = true }

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
