# >>> anvil-managed: anvil-deny-advisories
[advisories]
yanked = "deny"
# Scope of unmaintained-crate checks: "all" surfaces transitive
# dependencies too; tighten to "workspace" if the noise is high.
unmaintained = "all"
# Adopter-owned: repo-specific advisory ignores.
ignore = [
    # quick-xml 0.39.4 has two DoS advisories fixed only in >=0.41.0, but it is pulled in
    # transitively via the Azure SDK (typespec <- azure_core 1.0.0), which pins 0.39.x, so
    # we cannot bump it until an upstream Azure SDK release moves to quick-xml >=0.41. Both
    # are XML-parsing DoS issues with no production code path parsing untrusted XML here.
    # Remove once azure_core/typespec upgrade quick-xml.
    "RUSTSEC-2026-0194", # quadratic-time duplicate-attribute check
    "RUSTSEC-2026-0195", # unbounded namespace-declaration allocation
]
# <<< anvil-managed: anvil-deny-advisories

# >>> anvil-managed: anvil-deny-licenses
[licenses]
# Adopter-owned: curated allowlist. Add new entries only from "Permissive OSS
# licenses" on https://docs.opensource.microsoft.com/legal/resources/oss-licenses-by-type/.
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    # CDLA-Permissive-2.0 covers the Mozilla CA certificate data bundled by
    # `webpki-root-certs` (pulled in transitively via `rustls-platform-verifier`).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"
# <<< anvil-managed: anvil-deny-licenses

# >>> anvil-managed: anvil-deny-bans
[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# <<< anvil-managed: anvil-deny-bans

# >>> anvil-managed: anvil-deny-sources
[sources]
unknown-registry = "deny"
unknown-git = "deny"
# <<< anvil-managed: anvil-deny-sources
