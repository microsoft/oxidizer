# >>> anvil-managed: anvil-deny-advisories
[advisories]
yanked = "deny"
# Scope of unmaintained-crate checks: "all" surfaces transitive
# dependencies too; tighten to "workspace" if the noise is high.
unmaintained = "all"
# <<< anvil-managed: anvil-deny-advisories

# >>> anvil-managed: anvil-deny-licenses
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# <<< anvil-managed: anvil-deny-licenses

# Repository-specific policy extending the managed [licenses] table.
unused-allowed-license = "allow"

# CDLA-Permissive-2.0 covers the Mozilla CA certificate data bundled by
# `webpki-root-certs` (pulled in transitively via `rustls-platform-verifier`).
[[licenses.exceptions]]
allow = ["CDLA-Permissive-2.0"]
name = "webpki-root-certs"

# >>> anvil-managed: anvil-deny-bans
[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# <<< anvil-managed: anvil-deny-bans

# >>> anvil-managed: anvil-deny-sources
[sources]
unknown-registry = "deny"
unknown-git = "deny"
# <<< anvil-managed: anvil-deny-sources
